<style>
  /* ===== Theme tokens ===== */
  :root,
  [data-theme="light"] {
    --bg: #f6f4ee;
    --paper: #ffffff;
    --ink: #14110f;
    --ink-2: #4a4641;
    --ink-3: #8b847a;
    --rule: #e6e1d6;
    --rule-2: #efeae0;
    --accent: #c2410c;
    --accent-soft: rgba(194, 65, 12, 0.08);

    --node-5: #14110f; --node-5-light: #3a342d;
    --node-4: #14110f; --node-4-light: #3a342d;
    --node-3: #4a4641; --node-3-light: #6b645b;
    --node-2: #7a746a; --node-2-light: #8b847a;
    --node-1: #a8a298; --node-1-light: #b8b3a8;

    --label-primary: #14110f;
    --label-secondary: #6b645b;
    --label-dim: #c8c2b4;
    --label-border: #f6f4ee;

    --tooltip-bg: #ffffff;
    --tooltip-border: #e6e1d6;
    --tooltip-text: #14110f;
    --tooltip-text-2: #8b847a;
    --tooltip-shadow: 0 8px 24px rgba(20,17,15,0.08);

    --toggle-bg: #ffffff;
    --toggle-border: #e6e1d6;
    --toggle-icon: #4a4641;
    --toggle-shadow: 0 2px 6px rgba(60,40,10,0.10);
  }

  [data-theme="dark"] {
    --bg: #0a0e1a;
    --paper: #131a2e;
    --ink: #f5efde;
    --ink-2: #c4bda7;
    --ink-3: #8e8a7a;
    --rule: #1c2440;
    --rule-2: #1a1f3a;
    --accent: #d4a574;
    --accent-soft: rgba(212, 165, 116, 0.10);

    --node-5: #f5efde; --node-5-light: #c4bda7;
    --node-4: #f5efde; --node-4-light: #c4bda7;
    --node-3: #c4bda7; --node-3-light: #8e8a7a;
    --node-2: #8e8a7a; --node-2-light: #6b645b;
    --node-1: #6b645b; --node-1-light: #4a4641;

    --label-primary: #f5efde;
    --label-secondary: #c4bda7;
    --label-dim: #4a4641;
    --label-border: #0a0e1a;

    --tooltip-bg: #131a2e;
    --tooltip-border: #2a3056;
    --tooltip-text: #f5efde;
    --tooltip-text-2: #8e8a7a;
    --tooltip-shadow: 0 8px 24px rgba(0,0,0,0.5);

    --toggle-bg: #131a2e;
    --toggle-border: #2a3056;
    --toggle-icon: #d4a574;
    --toggle-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", "Times New Roman", Georgia, serif;
    font-feature-settings: "tnum" 1;
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .ui-font {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    height: 100vh;
  }
  /* Sidebar */
  aside {
    background: var(--paper);
    border-right: 1px solid var(--rule);
    padding: 36px 28px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .masthead {
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--rule);
  }
  .masthead .eyebrow {
    font-family: "Inter", -apple-system, sans-serif;
    font-size: 10px;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }
  .masthead h1 {
    font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
    margin-top: 8px;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .masthead .lede {
    font-family: "Source Han Serif SC", "Noto Serif SC", serif;
    font-size: 13px;
    color: var(--ink-2);
    margin-top: 10px;
    line-height: 1.55;
    font-style: italic;
  }

  .summary {
    display: flex;
    gap: 24px;
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--rule);
  }
  .summary .num {
    display: flex;
    flex-direction: column;
  }
  .summary .num .v {
    font-family: "Source Han Serif SC", serif;
    font-size: 32px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .summary .num .k {
    font-family: "Inter", sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-top: 6px;
  }

  .section { margin-bottom: 28px; }
  .section-label {
    font-family: "Inter", -apple-system, sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .section-label .hint {
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--ink-3);
    text-transform: none;
    font-weight: 400;
    font-style: italic;
  }

  .chapters {
    display: flex;
    flex-direction: column;
  }
  .chapter {
    display: grid;
    grid-template-columns: 8px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 9px 8px;
    margin: 0 -8px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .chapter:hover { background: var(--rule-2); }
  .chapter.active { background: var(--accent-soft); }
  .chapter .marker {
    width: 8px;
    background: var(--ink-3);
  }
  .chapter.tier-5 .marker { background: var(--node-5); height: 3px; }
  .chapter.tier-4 .marker { background: var(--node-4); height: 2px; }
  .chapter.tier-3 .marker { background: var(--node-3); height: 1px; }
  .chapter.tier-2 .marker { background: var(--node-2); height: 1px; opacity: 0.7; }
  .chapter.tier-1 .marker { background: var(--node-1); height: 1px; opacity: 0.5; }
  .chapter .name {
    font-size: 13.5px;
    color: var(--ink);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: "Source Han Serif SC", "Noto Serif SC", serif;
  }
  .chapter .pts {
    font-family: "Inter", sans-serif;
    font-size: 11px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .chapter.tier-5 .pts, .chapter.tier-4 .pts { color: var(--accent); }

  .footer-actions {
    margin-top: auto;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 16px;
  }
  .action {
    font-family: "Inter", sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-2);
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px 0;
    border-bottom: 1px solid var(--rule);
    transition: all 0.15s ease;
  }
  .action:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* Main */
  main {
    position: relative;
    overflow: hidden;
    background: var(--bg);
    transition: background 0.3s ease;
  }
  #chart {
    width: 100%;
    height: 100%;
  }
  .colophon {
    position: absolute;
    top: 28px;
    left: 32px;
    font-family: "Inter", sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .colophon .dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    background: var(--accent);
    border-radius: 50%;
    margin: 0 8px 1px;
    vertical-align: middle;
  }
  .hint {
    position: absolute;
    bottom: 24px;
    left: 32px;
    font-family: "Inter", sans-serif;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.3px;
  }
  .hint .sep { margin: 0 12px; color: var(--rule); }
  .hint em {
    font-style: normal;
    color: var(--ink-2);
    border-bottom: 1px dotted var(--ink-3);
    padding-bottom: 1px;
  }
  .pull {
    position: absolute;
    top: 24px;
    right: 70px;
    text-align: right;
    font-family: "Source Han Serif SC", "Noto Serif SC", serif;
  }
  .pull .quote {
    font-size: 13px;
    color: var(--ink-2);
    font-style: italic;
    line-height: 1.5;
    max-width: 240px;
  }
  .pull .quote em {
    font-style: normal;
    color: var(--accent);
    font-weight: 600;
  }
  .pull .src {
    font-family: "Inter", sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-top: 6px;
  }

  /* Scrollbar */
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-track { background: transparent; }
  aside::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }

  /* Theme toggle button (matches abbreviations-sunburst.html) */
  .theme-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 9999;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--toggle-border);
    background: var(--toggle-bg);
    color: var(--toggle-icon);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Inter", sans-serif;
    transition: all 0.2s ease;
    box-shadow: var(--toggle-shadow);
    padding: 0;
  }
  .theme-toggle:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: rotate(15deg);
  }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside { display: none; }
    .pull { display: none; }
  }
</style>
</head>

  { name: "专业英语",             score: 5,  topics: [
    { name: "完形填空", subs: [
      "IT 主题词汇(架构)",
      "IT 主题词汇(云)",
      "IT 主题词汇(微服务)",
      "IT 主题词汇(数据)",
      "IT 主题词汇(安全)",
      "词性优先答题法",
      "高频因果连词",
      "转折连词",
      "条件连词",
      "被动语态句型",
      "完形解题套路(单句)",
      "完形解题套路(上下文)",
    ]}
  ]}
];

// 跨章节共享叶子
const crossTopics = [
  { name: "MVC/MVP/MVVM", parents: ["系统架构设计::架构风格", "面向对象技术::图"], reason: "UI 架构风格" },
  { name: "4+1 视图", parents: ["系统架构设计::架构评估", "面向对象技术::图", "软件工程::系统设计"], reason: "UML 与架构共用" },
  { name: "UML 14 种图", parents: ["面向对象技术::图", "软件工程::系统设计"], reason: "UML 体系" },
  { name: "MTBF/MTTR/可用性", parents: ["软件可靠性::可靠性建模", "计算机系统基础知识::计算机硬件"], reason: "可靠性公式" },
  { name: "串并联可靠度公式", parents: ["软件可靠性::可靠性建模", "计算机系统基础知识::计算机硬件"], reason: "可靠性公式" },
  { name: "WBS 工作分解", parents: ["项目管理::进度管理", "软件工程::系统设计"], reason: "工程实践共用" },
  { name: "STRIDE 威胁建模", parents: ["信息安全技术基础::网络安全技术", "系统架构设计::架构评估"], reason: "架构级安全评估" },
  { name: "云原生 4 要素", parents: ["系统架构设计::架构风格", "未来信息综合技术::云计算"], reason: "云原生范式" },
  { name: "微服务架构", parents: ["系统架构设计::架构风格", "未来信息综合技术::云计算"], reason: "微服务范式" },
  { name: "TLS/SSL 协议", parents: ["信息安全技术基础::安全协议", "计算机网络::TCP/IP 协议族"], reason: "传输层安全" },
  { name: "防火墙 / IDS / IPS", parents: ["信息安全技术基础::网络安全技术", "计算机网络::OSI 七层模型"], reason: "网络安全设备" },
  { name: "蓝绿 / 金丝雀发布", parents: ["软件工程::运维", "软件架构的演化和维护::架构演化分类"], reason: "部署与演化" },
  { name: "REST 风格", parents: ["系统架构设计::架构风格", "计算机网络::TCP/IP 协议族"], reason: "Web 架构风格" },
  { name: "CMMI 5 级", parents: ["软件工程::软件工程定义概述", "项目管理::质量管理"], reason: "过程改进共用" },
  { name: "UML 关系 6 类", parents: ["面向对象技术::UML 关系", "软件工程::系统设计"], reason: "OOAD 共用" },
  { name: "CK 度量套件", parents: ["软件工程::软件工程定义概述", "面向对象技术::分析设计"], reason: "OO 度量" }
];

// ---------- Theme-aware palette ----------
function getCss(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function tierOf(s) {
  if (s >= 10) return { id: 5, color: () => getCss('--node-5'),    light: () => getCss('--node-5-light') };
  if (s >= 5)  return { id: 4, color: () => getCss('--node-4'),    light: () => getCss('--node-4-light') };
  if (s >= 3)  return { id: 3, color: () => getCss('--node-3'),    light: () => getCss('--node-3-light') };
  if (s >= 2)  return { id: 2, color: () => getCss('--node-2'),    light: () => getCss('--node-2-light') };
              return { id: 1, color: () => getCss('--node-1'),    light: () => getCss('--node-1-light') };
}

function tierById(id) {
  return { color: () => getCss('--node-' + id), light: () => getCss('--node-' + id + '-light') };
}

// ---------- Stats ----------
const total2nd = chapters.reduce((s,c) => s+c.topics.length, 0);
const total3rd = chapters.reduce((s,c) => s + c.topics.reduce((ss,t)=> ss+(t.subs?t.subs.length:0), 0), 0);
const totalScore  = chapters.reduce((s,c) => s+c.score, 0);
const maxCh       = chapters.reduce((a,b) => a.score >= b.score ? a : b);

document.getElementById('s-topics').textContent = total2nd + '·' + total3rd;
document.getElementById('s-score').textContent  = totalScore;
document.querySelector('.pull em').textContent  = maxCh.score + ' 分';
document.getElementById('s-lede').textContent   = `十九章 · ${total2nd} 主题 / ${total3rd} 叶子 · 七十四分`;

// ---------- Sidebar chapter list ----------
const listEl = document.getElementById('chapter-list');
const sorted = [...chapters].sort((a,b) => b.score - a.score);
sorted.forEach(ch => {
  const t = tierOf(ch.score);
  const item = document.createElement('div');
  item.className = `chapter tier-${t.id}`;
  item.dataset.name = ch.name;
  item.innerHTML = `
    <span class="marker"></span>
    <span class="name">${ch.name}</span>
    <span class="pts">${ch.score}</span>
  `;
  listEl.appendChild(item);
});

// ---------- Build graph data ----------
// 三级结构：章节(chapter) → 二级主题(topic) → 三级叶子(sub) + 跨章节共享叶子
const chapterIds = new Set();
const topicIds = new Set();        // 所有二级主题 id
const subIds = new Set();          // 所有三级叶子 id
const baseNodes = [];
const baseLinks = [];
chapters.forEach((ch, ci) => {
  chapterIds.add(ch.name);
  const t = tierOf(ch.score);
  baseNodes.push({
    isChapter: true,
    name: ch.name,
    value: ch.score,
    size: 22 + Math.pow(ch.score, 0.82) * 5.5,
    tier: t.id,
    raw: ch
  });
  ch.topics.forEach(topic => {
    const topicName = topic.name;
    const tid = ch.name + "::" + topicName;
    topicIds.add(tid);
    const w = 9 + (ch.score / ch.topics.length) * 2;
    baseNodes.push({
      isChapter: false,
      isTopic: true,
      id: tid,
      name: topicName,
      value: 1,
      size: w,
      tier: t.id,
      parent: ch.name,
      subCount: (topic.subs || []).length
    });
    baseLinks.push({ source: ch.name, target: tid, tier: t.id });
    // 三级叶子
    (topic.subs || []).forEach(sub => {
      const sid = tid + "||" + sub;
      subIds.add(sid);
      baseNodes.push({
        isChapter: false,
        isTopic: false,
        isSub: true,
        id: sid,
        name: sub,
        value: 1,
        size: 4.2,
        tier: t.id,
        parent: ch.name,
        parentTopic: topicName
      });
      baseLinks.push({ source: tid, target: sid, tier: t.id });
    });
  });
});

// 跨章节共享叶子 + 虚线连接
// 先建立索引：baseNodes by id + 章节分值 by chName
const chScoreByName = Object.fromEntries(chapters.map(c => [c.name, c.score]));

// 已拆分的跨主题：原名不再作为叶子存在，不应再建 cross-node（避免与拆分后的子节点重复）
const splitCrossNames = new Set();
{
  const allLeafNames = new Set();
  chapters.forEach(c => c.topics.forEach(t => (t.subs || []).forEach(s => allLeafNames.add(s))));
  crossTopics.forEach(c => { if (!allLeafNames.has(c.name)) splitCrossNames.add(c.name); });
}
crossTopics.forEach(ct => {
  // 拆分后的跨章节主题：其各部分已是独立叶子，不需要再建跨节点
  if (splitCrossNames.has(ct.name)) return;

  // 为每个跨主题找 1 个 canonical 节点：优先复用同名叶子，没有就以第一个 parent 的位置新建
  const parentPairs = ct.parents.map(p => {
    const [chName, topicName] = p.split("::");
    return { chName, topicName, topicNodeId: chName + "::" + topicName };
  });

  let canonical = null;
  for (const { chName, topicName } of parentPairs) {
    const existingId = chName + "::" + topicName + "||" + ct.name;
    if (subIds.has(existingId)) { canonical = { chName, topicName, leafId: existingId }; break; }
  }
  if (!canonical) {
    const { chName, topicName } = parentPairs[0];
    canonical = { chName, topicName, leafId: chName + "::" + topicName + "||" + ct.name };
  }

  // 标记/创建 canonical 节点
  const t = tierOf(chScoreByName[canonical.chName] || 3);
  if (subIds.has(canonical.leafId)) {
    const node = baseNodes.find(n => n.id === canonical.leafId);
    if (node) {
      node.isCross = true;
      node.crossReason = ct.reason;
    }
  } else {
    baseNodes.push({
      isChapter: false, isTopic: false, isSub: true, isCross: true,
      id: canonical.leafId,
      name: ct.name,
      value: 1,
      size: 5.5,
      tier: t.id,
      parent: canonical.chName,
      parentTopic: canonical.topicName,
      crossReason: ct.reason
    });
    subIds.add(canonical.leafId);
  }

  // 所有 parent 主题 → canonical 叶子（虚线）
  parentPairs.forEach(({ topicNodeId }) => {
    if (!topicIds.has(topicNodeId)) return;
    const exists = baseLinks.some(l => l.source === topicNodeId && l.target === canonical.leafId);
    if (!exists) baseLinks.push({ source: topicNodeId, target: canonical.leafId, tier: t.id, dashed: true });
  });
});

let nodes = [], links = [];

function buildGraph() {
  nodes = baseNodes.map(n => {
    const t = tierById(n.tier);
    if (n.isChapter) {
      return {
        id: n.name,
        name: n.name,
        symbolSize: n.size,
        value: n.value,
        category: 0,
        itemStyle: {
          color: t.color(),
          borderColor: getCss('--label-border'),
          borderWidth: 2
        },
        label: {
          show: true,
          fontSize: 12,
          fontWeight: 500,
          color: getCss('--label-primary'),
          textBorderColor: getCss('--label-border'),
          textBorderWidth: 3
        },
        raw: n.raw
      };
    } else if (n.isTopic) {
      // 二级主题节点（中等圆 + 标签）
      return {
        id: n.id,
        name: n.name,
        symbolSize: n.size,
        value: 1,
        category: 1,
        parent: n.parent,
        itemStyle: {
          color: t.light(),
          opacity: 0.85,
          borderColor: getCss('--accent'),
          borderWidth: 1.2
        },
        label: {
          show: true,
          fontSize: 9.5,
          fontWeight: 500,
          color: getCss('--label-primary'),
          textBorderColor: getCss('--label-border'),
          textBorderWidth: 2.5
        },
        subCount: n.subCount
      };
    } else {
      // 三级叶子节点（小圆点）
      return {
        id: n.id,
        name: n.name,
        symbolSize: n.size,
        value: 1,
        category: 2,
        parent: n.parent,
        parentTopic: n.parentTopic,
        isCross: !!n.isCross,
        crossReason: n.crossReason,
        itemStyle: {
          color: n.isCross ? getCss('--accent') : t.light(),
          opacity: n.isCross ? 0.85 : 0.5,
          borderColor: n.isCross ? getCss('--accent') : getCss('--label-border'),
          borderWidth: n.isCross ? 1 : 0.5
        },
        label: {
          show: true,
          fontSize: n.isCross ? 8.5 : 7.5,
          fontWeight: n.isCross ? 500 : 400,
          color: n.isCross ? getCss('--label-primary') : getCss('--label-secondary'),
          textBorderColor: getCss('--label-border'),
          textBorderWidth: n.isCross ? 2 : 1.5
        }
      };
    }
  });
  links = baseLinks.map(l => {
    const t = tierById(l.tier);
    const dashed = l.dashed || l.cross;
    return {
      source: l.source,
      target: l.target,
      lineStyle: {
        color: dashed ? getCss('--accent') : t.color(),
        opacity: dashed ? 0.45 : 0.18,
        width: dashed ? 0.8 : 0.5,
        curveness: dashed ? 0.08 : 0.02,
        type: dashed ? 'dashed' : 'solid'
      }
    };
  });
}

// ---------- Chart ----------
const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });

function renderChart() {
  buildGraph();
  // 防御性过滤：丢掉 source/target 不在 nodes 集合里的 link（避免 echarts 报 dataIndex undefined）
  const idSet = new Set(nodes.map(n => n.id));
  const safeLinks = links.filter(l => idSet.has(l.source) && idSet.has(l.target));
  if (safeLinks.length !== links.length) {
    console.warn('Dropped ' + (links.length - safeLinks.length) + ' broken links');
  }
  links = safeLinks;
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      backgroundColor: getCss('--tooltip-bg'),
      borderColor: getCss('--tooltip-border'),
      borderWidth: 1,
      padding: [10, 14],
      textStyle: { color: getCss('--tooltip-text'), fontSize: 12 },
      extraCssText: `border-radius: 4px; box-shadow: ${getCss('--tooltip-shadow')};`,
      formatter: (p) => {
        if (p.dataType === 'edge') return '';
        const n = p.data;
        if (chapterIds.has(n.id)) {
          return `<div style="font-weight:600;font-size:13px;margin-bottom:4px;font-family:'Source Han Serif SC',serif">${n.name}</div>
                  <div style="color:${getCss('--tooltip-text-2')};font-size:11px;font-family:'Inter',sans-serif">分值 · <span style="color:${getCss('--accent')};font-weight:600">${n.value}</span>　知识点 · ${n.raw.topics.length}</div>`;
        } else if (topicIds.has(n.id)) {
          return `<div style="font-weight:600;font-size:12px;margin-bottom:3px;font-family:'Source Han Serif SC',serif">${n.name}</div>
                  <div style="color:${getCss('--tooltip-text-2')};font-size:11px;font-family:'Inter',sans-serif">${n.parent} · <span style="color:${getCss('--accent')};font-weight:500">${n.subCount} 叶子</span></div>`;
        } else {
          const crossBadge = n.isCross ? `<span style="color:${getCss('--accent')};font-weight:600">跨章节</span>　${n.crossReason || ''}` : '';
          return `<div style="font-weight:500;font-size:12px;margin-bottom:3px;font-family:'Source Han Serif SC',serif">${n.name}</div>
                  <div style="color:${getCss('--tooltip-text-2')};font-size:11px;font-family:'Inter',sans-serif">${n.parent} → ${n.parentTopic}</div>
                  ${crossBadge ? `<div style="color:${getCss('--tooltip-text-2')};font-size:10px;font-family:'Inter',sans-serif;margin-top:2px">${crossBadge}</div>` : ''}`;
        }
      }
    },
    series: [{
      type: 'graph',
      layout: 'force',
      animation: true,
      animationDuration: 1200,
      animationEasingUpdate: 'cubicOut',
      roam: true,
      draggable: true,
      cursor: 'pointer',
      data: nodes,
      links: links,
      categories: [{ name: "章节" }, { name: "知识点" }, { name: "叶子" }],
      force: {
        edgeLength: 30,
        repulsion: 90,
        gravity: 0.08,
        friction: 0.2,
        layoutAnimation: true
      },
      emphasis: {
        focus: 'adjacency',
        label: { fontSize: 13, fontWeight: 600 },
        itemStyle: { borderColor: getCss('--accent'), borderWidth: 2.5 }
      },
      label: {
        show: true,
        position: 'inside',
        formatter: '{b}',
        overflow: 'truncate',
        width: 110,
        ellipsis: '…'
      },
      labelLayout: {
        hideOverlap: true,
        moveOverlap: 'shiftY'
      },
      lineStyle: {
        color: 'source',
        opacity: 0.22,
        curveness: 0.02
      },
      edgeSymbol: ['none', 'none']
    }]
  });
}

renderChart();

// ---------- Interactions ----------
let currentFocus = null;

// 给定节点 id，收集它本身 + 向下所有子节点 + 向上所有祖先节点
function relatedSubtree(rootId) {
  const result = new Set([rootId]);
  // 向下 BFS（沿 source → target 方向）：子节点
  let frontier = [rootId];
  while (frontier.length) {
    const next = [];
    links.forEach(l => {
      if (frontier.includes(l.source) && !result.has(l.target)) {
        result.add(l.target);
        next.push(l.target);
      }
    });
    frontier = next;
  }
  // 向上 BFS（沿 target → source 方向）：祖先节点
  frontier = [rootId];
  while (frontier.length) {
    const next = [];
    links.forEach(l => {
      if (frontier.includes(l.target) && !result.has(l.source)) {
        result.add(l.source);
        next.push(l.source);
      }
    });
    frontier = next;
  }
  return result;
}

// 保留旧的章节聚焦接口（侧栏按钮仍调用）
function focusOnChapter(name) {
  // 章节 → 与 graph 章节节点点击行为对齐：整个子树高亮 + 居中
  focusOnNode(name, { center: true });
}

// 任意节点聚焦：仅高亮该节点所在子树（向上父链 + 向下所有子节点）
function focusOnNode(nodeId, { center = true } = {}) {
  currentFocus = nodeId;
  const related = relatedSubtree(nodeId);
  applyHighlight(related);
  if (center) centerOnNode(nodeId);
  // 侧栏高亮：找到该节点所属的章节
  const n = nodes.find(x => x.id === nodeId);
  const chName = n ? (chapterIds.has(nodeId) ? nodeId : n.parent) : null;
  highlightSidebar(chName);
}

function applyHighlight(highlightSet) {
  chart.setOption({
    series: [{
      data: nodes.map(n => ({
        ...n,
        itemStyle: {
          ...n.itemStyle,
          opacity: highlightSet.has(n.id) ? (n.category === 0 ? 1 : (n.isCross ? 1 : 0.85)) : 0.12
        },
        label: {
          ...n.label,
          color: highlightSet.has(n.id)
            ? (n.category === 0 ? getCss('--label-primary') : (n.isCross ? getCss('--accent') : getCss('--label-secondary')))
            : getCss('--label-dim')
        }
      })),
      links: links.map(l => {
        const isHit = highlightSet.has(l.source) && highlightSet.has(l.target);
        return { ...l, lineStyle: { ...l.lineStyle, opacity: isHit ? 0.6 : 0.04 } };
      })
    }]
  });
}

// 把指定节点置于可视区域中心：不移动节点，改为平移画布（roam dx/dy）
function centerOnNode(nodeId) {
  // 等 force 动画收敛后再读坐标
  setTimeout(() => {
    const opt = chart.getOption();
    const series = opt.series && opt.series[0];
    if (!series) return;
    const data = series.data;
    const target = data.find(d => d.id === nodeId);
    if (!target || target.x == null || target.y == null) return;
    const container = document.getElementById('chart');
    const w = container.clientWidth, h = container.clientHeight;
    // 用 graphRoam 平移画布（不修改节点坐标），把节点移到屏幕中央
    const dx = (w / 2) - target.x;
    const dy = (h / 2) - target.y;
    chart.dispatchAction({
      type: 'graphRoam',
      seriesIndex: 0,
      dx,
      dy
    });
  }, 1300);
}

function resetFocus() {
  currentFocus = null;
  chart.setOption({ series: [{ data: nodes, links: links }] });
  highlightSidebar(null);
}

function highlightSidebar(name) {
  document.querySelectorAll('.chapter').forEach(el => {
    el.classList.toggle('active', el.dataset.name === name);
  });
}

chart.on('click', { dataType: 'node' }, (params) => {
  // 直接聚焦到该节点本身，沿父子链高亮
  focusOnNode(params.data.id);
});
chart.on('dblclick', () => resetFocus());

// hover：临时高亮相关子树；mouseout：恢复（保留点击聚焦状态）
chart.on('mouseover', { dataType: 'node' }, (params) => {
  if (currentFocus === params.data.id) return;
  const related = relatedSubtree(params.data.id);
  applyHighlight(related);
});
chart.on('mouseout', { dataType: 'node' }, () => {
  if (currentFocus) focusOnNode(currentFocus, { center: false });
  else resetFocus();
});

document.querySelectorAll('.chapter').forEach(el => {
  el.addEventListener('click', () => focusOnChapter(el.dataset.name));
});

document.getElementById('btn-replay').addEventListener('click', () => {
  resetFocus();
  chart.setOption({ series: [{ force: { layoutAnimation: true } }] });
});
document.getElementById('btn-clear').addEventListener('click', () => resetFocus());

// ---------- Theme toggle (matches abbreviations-sunburst.html) ----------
(function() {
  const KEY = 'forcegraph-theme';
  function apply(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = theme === 'light' ? '☾' : '☀';
  }
  window.toggleTheme = function() {
    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = cur === 'light' ? 'dark' : 'light';
    try { localStorage.setItem(KEY, next); } catch(e) {}
    apply(next);
    // Rebuild chart so node colors reflect current theme
    renderChart();
    if (currentFocus) focusOnNode(currentFocus);
  };
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) apply(saved);
  } catch(e) {}
  document.addEventListener('keydown', function(e) {
    if ((e.key === 't' || e.key === 'T') && !e.ctrlKey && !e.metaKey && !e.altKey
        && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) {
      toggleTheme();
    }
  });
})();

window.addEventListener('resize', () => chart.resize());
</script>
