<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识图谱 · 系统架构设计师知识体系</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
:root {
  --ink-0: #06091a;
  --ink-1: #0a0f1f;
  --ink-2: #131a2e;
  --ink-3: #1c2440;
  --ink-4: #2a3056;
  --gold-1: #e8c384;
  --gold-2: #d4a574;
  --gold-3: #b88a52;
  --gold-4: #8b6f3e;
  --ivory-0: #faf6e8;
  --ivory-1: #f5f0e1;
  --ivory-2: #c4bda7;
  --ivory-3: #8e8a7a;
  --crimson: #c8553d;
  --emerald: #5d8a6f;
  --azure: #4a6fa5;
  --violet: #6f5d8a;
  --amber-deep: #b8673f;
  --copper: #c8956a;
  --steel: #5a7d8a;
  --deep-emerald: #3d8a6b;
  --mauve: #9c6b8a;
  --ink-1-rgb: 10, 15, 31;
  --font-display: 'Cinzel', 'Noto Serif SC', serif;
  --font-body: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'Consolas', monospace;
  --font-cn: 'Noto Serif SC', 'Songti SC', serif;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background: var(--ink-0);
  font-family: var(--font-body);
  color: var(--ivory-1);
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(212, 165, 116, 0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(74, 111, 165, 0.08) 0%, transparent 50%);
  background-attachment: fixed;
  overflow: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(212, 165, 116, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212, 165, 116, 0.02) 1px, transparent 1px);
  background-size: 64px 64px;
  pointer-events: none; z-index: 0;
}

#graph{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;z-index:1}
#graph.grabbing{cursor:grabbing}
#graph.hot{cursor:pointer}

.glass{
  background: rgba(var(--ink-1-rgb), 0.85);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid var(--ink-4);
  border-radius: 4px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(212,165,116,0.06);
}

#panel{
  position:fixed;top:20px;right:20px;width:310px;
  max-height:calc(100vh - 40px);
  display:flex;flex-direction:column;padding:18px;z-index:10;
  animation:slideIn .55s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

.panel-head h1{
  font-family: var(--font-cn);
  font-size: 1.05rem; font-weight: 700;
  color: var(--ivory-0);
  letter-spacing: 0.04em;
}
.panel-head .brand{
  font-family: var(--font-display);
  font-size: 0.66rem; letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold-3);
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}
.panel-head .brand::before{
  content:''; display:inline-block;
  width: 7px; height: 7px;
  background: var(--gold-2);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--gold-2);
}
.panel-head p{font-size:11px;color:var(--ivory-3);margin-top:8px;letter-spacing:.2px;font-family:var(--font-mono)}

#panel-body{margin-top:16px;flex:1;overflow-y:auto;min-height:0}
#panel-body::-webkit-scrollbar{width:5px}
#panel-body::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:3px}

.empty{text-align:center;padding:26px 8px;color:var(--ivory-3);font-size:12px;line-height:1.9}
.empty .ei{
  font-family: var(--font-display);
  font-size: 2rem;
  color: var(--ink-4);
  margin-bottom: 10px;
  letter-spacing: 0.2em;
}
.empty .hint{
  font-family: var(--font-mono);
  font-size: 11px;
  margin-top: 14px;
  color: var(--ivory-3);
  line-height: 1.9;
}

.node-title{display:flex;align-items:center;gap:9px}
.node-title h2{
  font-family: var(--font-cn);
  font-size: 1.15rem; font-weight: 700;
  color: var(--ivory-0);
  letter-spacing: 0.04em; line-height: 1.35;
}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}

.path{font-size:11px;color:var(--ivory-3);margin-top:7px;letter-spacing:.2px;line-height:1.6;font-family:var(--font-mono)}

.badge{
  display: inline-block;
  margin-top: 10px;
  padding: 3px 10px;
  border-radius: 3px;
  font-family: var(--font-display);
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  border: 1px solid currentColor;
  opacity: 0.92;
}

.stats{display:flex;gap:8px;margin-top:14px}
.stats>div{
  flex:1;text-align:center;padding:9px 4px;border-radius:4px;
  background: var(--ink-2);
  border: 1px solid var(--ink-4);
}
.stats b{
  display: block;
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 600;
  color: var(--gold-2);
  line-height: 1.2;
}
.stats span{
  font-family: var(--font-display);
  font-size: 0.6rem;
  color: var(--ivory-3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-top: 2px;
  display: block;
}

.section{margin-top:16px}
.section h3{
  font-family: var(--font-display);
  font-size: 0.66rem;
  font-weight: 600;
  color: var(--gold-3);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  margin-bottom: 9px;
  display: flex; align-items: center; gap: 6px;
}
.section h3::before{
  content:''; width: 14px; height: 1px;
  background: var(--gold-3);
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-family: var(--font-mono);
  font-size: 11.5px;
  padding: 5px 10px;
  border-radius: 12px;
  cursor: pointer;
  background: var(--ink-2);
  border: 1px solid var(--ink-4);
  color: var(--ivory-1);
  transition: .16s;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chip:hover{background:var(--ink-3);border-color:var(--gold-3);color:var(--gold-2);transform:translateY(-1px)}
.chip.anc{border-color:rgba(184,138,82,.45);color:var(--gold-1)}
.chip.anc:hover{background:rgba(184,138,82,.14)}
.chip.desc{border-color:rgba(93,138,111,.45);color:var(--emerald)}
.chip.desc:hover{background:rgba(93,138,111,.14)}

.panel-foot{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--ink-4)}
.panel-foot button{
  flex:1;padding:8px;border-radius:3px;cursor:pointer;
  font-family: var(--font-display);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ivory-2);
  background: var(--ink-2);
  border: 1px solid var(--ink-4);
  transition: .16s;
}
.panel-foot button:hover{background:var(--ink-3);color:var(--gold-2);border-color:var(--gold-3)}
.panel-foot button.on{background:rgba(184,138,82,.16);color:var(--gold-1);border-color:var(--gold-3)}

#legend{
  position:fixed;left:20px;top:20px;width:310px;padding:14px 16px;z-index:10;
  max-height:calc(100vh - 40px);overflow-y:auto;
  animation:slideIn .55s .1s cubic-bezier(.2,.8,.3,1) both;
}
#legend::-webkit-scrollbar{width:5px}
#legend::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:3px}
.legend-title{
  font-family: var(--font-display);
  font-size: 0.66rem;
  color: var(--gold-3);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.legend-title::before{
  content:''; width: 14px; height: 1px;
  background: var(--gold-3);
}
.lg-row{
  display:flex; align-items:center; gap:8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ivory-2);
  margin-top: 6px;
  line-height: 1.4;
  padding: 3px 6px;
  border-radius: 3px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.lg-row:hover{ background: var(--ink-3); color: var(--gold-2); }
.lg-row.active{
  background: rgba(184, 138, 82, 0.16);
  border-color: var(--gold-3);
  color: var(--gold-1);
}
.lg-row i{width:8px;height:8px;border-radius:50%;flex:none}
.lg-row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#hint{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ivory-3);
  letter-spacing: .15em;
  z-index:9;
  padding: 7px 16px;
  border-radius: 4px;
  background: rgba(var(--ink-1-rgb), 0.7);
  border: 1px solid var(--ink-4);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  animation: slideIn .6s .25s cubic-bezier(.2,.8,.3,1) both;
  white-space: nowrap;
}

#tooltip{
  position:fixed;pointer-events:none;display:none;z-index:30;
  padding: 6px 12px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.04em;
  background: rgba(10, 15, 31, 0.96);
  border: 1px solid var(--gold-3);
  color: var(--ivory-1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  white-space:nowrap;
  max-width: 340px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===== Theme toggle button ===== */
.theme-toggle {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 9999;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--ink-4);
  background: var(--ink-2);
  color: var(--gold-1);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.35);
}
.theme-toggle:hover {
  border-color: var(--gold-1);
  background: var(--ink-3);
  transform: rotate(15deg);
}

/* ===== Light Theme (ink ↔ ivory flip) ===== */
[data-theme="light"] {
  --ink-0: #f5efde;
  --ink-1: #ebe4cf;
  --ink-2: #ddd2b3;
  --ink-3: #c9bd9a;
  --ink-4: #a89a72;
  --gold-1: #8a6a2c;
  --gold-2: #a07a32;
  --gold-3: #6f5421;
  --gold-4: #4a3814;
  --gold-5: #2e2208;
  --ivory-0: #1a1a1a;
  --ivory-1: #2a2a2a;
  --ivory-2: #4d4a40;
  --ivory-3: #6f6b5d;
  --crimson: #a83d27;
  --emerald: #3f6b53;
  --azure: #355080;
  --violet: #564268;
  --ink-1-rgb: 235, 228, 207;
}
[data-theme="light"] body {
  background-image:
    radial-gradient(ellipse at 30% 20%, rgba(140, 100, 40, 0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 70% 80%, rgba(53, 80, 128, 0.08) 0%, transparent 55%);
}
[data-theme="light"] body::before {
  background-image:
    linear-gradient(rgba(106, 85, 33, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(106, 85, 33, 0.05) 1px, transparent 1px);
}
[data-theme="light"] #panel,
[data-theme="light"] #legend,
[data-theme="light"] #tooltip,
[data-theme="light"] #hint {
  border-color: var(--ink-3);
  box-shadow: 0 8px 32px rgba(60,40,10,0.18), inset 0 1px 0 rgba(255,255,255,0.4);
}
[data-theme="light"] .stats > div,
[data-theme="light"] .panel-foot button,
[data-theme="light"] .chip {
  background: var(--ink-1);
  border-color: var(--ink-3);
}
[data-theme="light"] .theme-toggle {
  box-shadow: 0 2px 6px rgba(60,40,10,0.18);
}
[data-theme="light"] #tooltip {
  background: rgba(245, 239, 222, 0.98);
  color: var(--ivory-1);
}

@media print {
  body, html { background: white !important; color: #1a1a1a !important; }
  .theme-toggle, #hint { display: none !important; }
  [data-theme="light"] { --ink-0:#fff; --ink-1:#fff; --ink-2:#f7f3e8; --ink-3:#d4c9a5; --ink-4:#a89a72; --ivory-0:#1a1a1a; --ivory-1:#1a1a1a; }
}
</style>
</head>
<body>

<canvas id="graph"></canvas>

<div id="panel" class="glass">
  <div class="panel-head">
    <div class="brand">Knowledge Graph</div>
    <h1>系统架构设计师 · 知识体系</h1>
    <p id="stat-line">加载中…</p>
  </div>
  <div id="panel-body"></div>
  <div class="panel-foot">
    <button id="btn-fit">适应视图</button>
    <button id="btn-spin" class="on">自动旋转</button>
  </div>
</div>

<div id="legend" class="glass">
  <div class="legend-title">章节</div>
  <div id="legend-items"></div>
</div>

<button class="theme-toggle" id="theme-toggle" title="切换深/浅主题 (T)">☾</button>

<div id="hint">悬停预览 · 点击锁定 · 拖拽旋转 · 滚轮缩放</div>
<div id="tooltip"></div>

<script>
(() => {
'use strict';

/* ══════════════════════════════════════════════
   数据源：章节 → 主题 → 子主题
   ══════════════════════════════════════════════ */

const chapters = [

  ]},
  { name: "操作系统", score: 3, topics: [

    { name: "存储管理", subs: ["分页","分段","段页式","页面置换 FIFO","LRU","Clock","OPT","虚拟存储","快表 TLB","内存分配策略"]},
    { name: "文件管理", subs: ["文件逻辑","物理结构","FAT","inode","ext4","空闲块管理(位图)","空闲块管理(链式)","文件操作接口"]},
    { name: "设备管理", subs: ["I/O 控制 4 种(程序)","I/O 控制 4 种(中断)","I/O 控制 4 种(DMA)","I/O 控制 4 种(通道)","磁盘调度 FCFS","SSTF","SCAN","SPOOLing","缓冲技术"]}

  { name: "数据库技术", score: 3, topics: [

    { name: "关系代数", subs: ["并","差","交","笛卡尔积","选择","投影","连接","自然连接 vs 外连接","元组","域关系演算"]},
    { name: "范式", subs: ["函数依赖与闭包","1NF 原子性","2NF 消除部分依赖","3NF 消除传递依赖","BCNF","Armstrong 公理","候选码求解"]},
    { name: "事务并发", subs: ["ACID 四特性","脏读","不可重复读","幻读","4 大隔离级别","2PC","3PC","TCC 补偿","Saga 长事务","本地消息表","CAP 定理","BASE 理论","Paxos","Raft","ZAB"]},

    { name: "嵌入式操作系统", subs: ["硬实时","软实时","弱实时","FreeRTOS","VxWorks","QNX","RTOS 任务调度","中断处理","存储保护 MMU"]},

    { name: "多媒体", subs: ["音频 PCM","MP3","AAC","视频 H.264","H.265","无损 vs 有损压缩","VR","AR","MR"]},

  ]},

function hslToHex(h, s, l) {
  l /= 100;
  const a = s * Math.min(l, 1 - l) / 100;
  const f = n => {
    const k = (n + h / 30) % 12;
    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * color).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}

const nodes = [];

    cluster: cid,
    kind: 'chapter',
    x: 0, y: 0, z: 0,
    vx: 0, vy: 0, vz: 0,

    fixed: false,
    _sx: 0, _sy: 0, _s: 1, _d: 1,

    edges.push({ a: chIdx, b: a, kind: 'chapter-link' });
  });
});

/* 跨章节边 */
function findTopicId(chapterName, topicName) {
  for (let ci = 0; ci < chapters.length; ci++) {
    if (chapters[ci].name !== chapterName) continue;
    for (let ti = 0; ti < chapters[ci].topics.length; ti++) {
      if (chapters[ci].topics[ti].name === topicName) return `t_${ci}_${ti}`;
    }
  }
  return null;
}

let crossEdgeCount = 0;
crossTopics.forEach(ct => {
  const ids = [];
  ct.parents.forEach(p => {
    const [cn, tn] = p.split('::');
    const id = findTopicId(cn, tn);
    if (id && idToIndex.has(id)) ids.push(idToIndex.get(id));
  });
  for (let i = 0; i < ids.length; i++) {
    for (let j = i + 1; j < ids.length; j++) {
      edges.push({ a: ids[i], b: ids[j], kind: 'cross', label: ct.name });
      crossEdgeCount++;
    }
  }
});

/* 邻接表 */
const outAdj = Array.from({ length: nodes.length }, () => []);
const inAdj  = Array.from({ length: nodes.length }, () => []);
edges.forEach((e, i) => {
  outAdj[e.a].push(i);
  inAdj[e.b].push(i);
});

const maxDeg = Math.max(1, ...nodes.map(n => n.deg));
const maxTopicDeg = Math.max(1, ...nodes.filter(n => n.kind === 'topic').map(n => n.deg));
const maxChapterDeg = Math.max(1, ...nodes.filter(n => n.kind === 'chapter').map(n => n.deg));
const nodeRadius = n => {
  if (n.kind === 'chapter') {
    return 18 + 10 * Math.sqrt(n.deg / maxChapterDeg);
  }
  if (n.kind === 'topic') {
    return 7 + 8 * Math.sqrt(n.deg / maxTopicDeg);
  }
  return 3.2 + 3.5 * Math.sqrt(n.deg / maxTopicDeg);
};

/* ══════════════════════════════════════════════
   初始布局（斐波那契球面 + 分层）
   ══════════════════════════════════════════════ */

const CLUSTER_R = 700;
const TOPIC_R = 130;
const SUB_R = 22;

function fibSphere(i, n, radius) {
  if (n <= 1) return { x: 0, y: 0, z: 0 };
  const phi = Math.acos(1 - 2 * (i + 0.5) / n);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;
  return {
    x: Math.cos(theta) * Math.sin(phi) * radius,
    y: Math.sin(theta) * Math.sin(phi) * radius,
    z: Math.cos(phi) * radius,
  };
}

const clusterCenters = {};
chapters.forEach((ch, ci) => {
  const cid = `ch_${ci}`;
  const chid = `c_${ci}`;
  const cc = fibSphere(ci, chapters.length, CLUSTER_R);
  clusterCenters[cid] = cc;

  /* 章节节点固定在 cluster 球心 */
  const chIdx = idToIndex.get(chid);
  nodes[chIdx].x = cc.x;
  nodes[chIdx].y = cc.y;
  nodes[chIdx].z = cc.z;
  nodes[chIdx].fixed = true;  /* 钉住中心节点，避免力导向让它乱飞 */

  ch.topics.forEach((topic, ti) => {
    const tid = `t_${ci}_${ti}`;
    const tc = fibSphere(ti, ch.topics.length, TOPIC_R);
    const tIdx = idToIndex.get(tid);
    const tCenter = { x: cc.x + tc.x, y: cc.y + tc.y, z: cc.z + tc.z };
    nodes[tIdx].x = tCenter.x;
    nodes[tIdx].y = tCenter.y;
    nodes[tIdx].z = tCenter.z;

    topic.subs.forEach((sub, si) => {
      const sid = `s_${ci}_${ti}_${si}`;
      const sc = fibSphere(si, topic.subs.length, SUB_R);
      const sIdx = idToIndex.get(sid);
      nodes[sIdx].x = tCenter.x + sc.x + (Math.random() - 0.5) * 4;
      nodes[sIdx].y = tCenter.y + sc.y + (Math.random() - 0.5) * 4;
      nodes[sIdx].z = tCenter.z + sc.z + (Math.random() - 0.5) * 4;
    });
  });
});

/* ══════════════════════════════════════════════
   3D 力导向（仅烘焙 + 拖拽时使用）
   ══════════════════════════════════════════════ */

const REP          = 2200;
const SPRING_LEN   = 30;
const SPRING_K     = 0.045;
const CLUSTER_PULL = 0.006;
const CENTER_PULL  = 0.0008;
const DAMP         = 0.86;
const MAX_SPEED    = 14;

const fx = new Float32Array(nodes.length);
const fy = new Float32Array(nodes.length);
const fz = new Float32Array(nodes.length);

function simulate(alpha, applyAll) {
  const n = nodes.length;
  fx.fill(0); fy.fill(0); fz.fill(0);

  // 斥力
  if (applyAll) {
    for (let i = 0; i < n; i++) {
      const a = nodes[i];
      const ax = a.x, ay = a.y, az = a.z;
      let fix = 0, fiy = 0, fiz = 0;
      for (let j = i + 1; j < n; j++) {
        const b = nodes[j];
        let dx = b.x - ax, dy = b.y - ay, dz = b.z - az;
        let d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < 1) {
          dx = Math.random() - 0.5; dy = Math.random() - 0.5; dz = Math.random() - 0.5;
          d2 = dx * dx + dy * dy + dz * dz || 1;
        }
        const d = Math.sqrt(d2);
        const f = REP / d2;
        const inv = f / d;
        const px = dx * inv, py = dy * inv, pz = dz * inv;
        fix -= px; fiy -= py; fiz -= pz;
        fx[j] += px; fy[j] += py; fz[j] += pz;
      }
      fx[i] += fix; fy[i] += fiy; fz[i] += fiz;
    }
  } else {
    // 只对活跃节点计算斥力
    for (let i = 0; i < n; i++) {
      if (nodes[i].fixed) continue;
      const a = nodes[i];
      const ax = a.x, ay = a.y, az = a.z;
      let fix = 0, fiy = 0, fiz = 0;
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const b = nodes[j];
        let dx = b.x - ax, dy = b.y - ay, dz = b.z - az;
        let d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < 1) continue;
        if (d2 > 40000) continue; // 只对近邻计算
        const d = Math.sqrt(d2);
        const f = REP / d2;
        const inv = f / d;
        fix -= dx * inv; fiy -= dy * inv; fiz -= dz * inv;
      }
      fx[i] += fix; fy[i] += fiy; fz[i] += fiz;
    }
  }

  // 弹簧
  for (let ki = 0; ki < edges.length; ki++) {
    const e = edges[ki];
    if (e.kind === 'cross') continue; // 跨章节边不参与弹簧
    const A = nodes[e.a], B = nodes[e.b];
    const dx = B.x - A.x, dy = B.y - A.y, dz = B.z - A.z;
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.01;
    /* 章节→主题 边用更弱弹簧，避免把 topic 拉得太贴 chapter */
    const isChapterLink = e.kind === 'chapter-link';
    const len = isChapterLink ? SPRING_LEN * 5 : SPRING_LEN;
    const springK = isChapterLink ? SPRING_K * 0.25 : SPRING_K;
    const f = (d - len) * springK;
    const inv = f / d;
    const px = dx * inv, py = dy * inv, pz = dz * inv;
    fx[e.a] += px; fy[e.a] += py; fz[e.a] += pz;
    fx[e.b] -= px; fy[e.b] -= py; fz[e.b] -= pz;
  }

  // 聚类引力 + 向心
  for (let i = 0; i < n; i++) {
    const nd = nodes[i];
    const c = clusterCenters[nd.cluster];
    fx[i] += (c.x - nd.x) * CLUSTER_PULL - nd.x * CENTER_PULL;
    fy[i] += (c.y - nd.y) * CLUSTER_PULL - nd.y * CENTER_PULL;
    fz[i] += (c.z - nd.z) * CLUSTER_PULL - nd.z * CENTER_PULL;
  }

  // 积分
  for (let i = 0; i < n; i++) {
    const nd = nodes[i];
    if (nd.fixed) { nd.vx = nd.vy = nd.vz = 0; continue; }
    nd.vx = (nd.vx + fx[i] * alpha) * DAMP;
    nd.vy = (nd.vy + fy[i] * alpha) * DAMP;
    nd.vz = (nd.vz + fz[i] * alpha) * DAMP;
    const sp = Math.sqrt(nd.vx * nd.vx + nd.vy * nd.vy + nd.vz * nd.vz);
    if (sp > MAX_SPEED) {
      const k = MAX_SPEED / sp;
      nd.vx *= k; nd.vy *= k; nd.vz *= k;
    }
    nd.x += nd.vx; nd.y += nd.vy; nd.z += nd.vz;
  }
}

/* ══════════════════════════════════════════════
   相机 + 投影
   ══════════════════════════════════════════════ */

const FOCAL = 1600;
const cam = {
  yaw: 0.72, pitch: -0.28, dist: 2200, zoom: 1,
  tx: 0, ty: 0, txT: 0, tyT: 0,
};

let _cosY = 1, _sinY = 0, _cosP = 1, _sinP = 0;

function updateCamTrig() {
  _cosY = Math.cos(cam.yaw);  _sinY = Math.sin(cam.yaw);
  _cosP = Math.cos(cam.pitch); _sinP = Math.sin(cam.pitch);
}

function project(n) {
  const x1 =  n.x * _cosY + n.z * _sinY;
  const z1 = -n.x * _sinY + n.z * _cosY;
  const y2 =  n.y * _cosP - z1 * _sinP;
  const z2 =  n.y * _sinP + z1 * _cosP;
  const d = cam.dist - z2;
  const s = FOCAL / Math.max(d, 120) * cam.zoom;
  n._sx = W / 2 + x1 * s + cam.tx;
  n._sy = H / 2 + y2 * s + cam.ty;
  n._s  = s;
  n._d  = d;
}

/* ══════════════════════════════════════════════
   Canvas
   ══════════════════════════════════════════════ */

const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const panelBody = document.getElementById('panel-body');

let dpr = 1, W = 0, H = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  buildStars();
}

function parseHex(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(hex, a) {
  const c = parseHex(hex);
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

const glowCache = new Map();
function getGlow(color) {
  let s = glowCache.get(color);
  if (s) return s;
  const S = 96;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grd.addColorStop(0.00, rgba(color, 0.90));
  grd.addColorStop(0.12, rgba(color, 0.45));
  grd.addColorStop(0.34, rgba(color, 0.14));
  grd.addColorStop(1.00, rgba(color, 0));
  g.fillStyle = grd;
  g.fillRect(0, 0, S, S);
  glowCache.set(color, cv);
  return cv;
}

let starCanvas = null;
function buildStars() {
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(W));
  cv.height = Math.max(1, Math.round(H));
  const g = cv.getContext('2d');
  // 亮主题不绘制星空
  if (currentTheme === 'light') {
    starCanvas = null;
    return;
  }
  const count = Math.round(Math.min(400, W * H / 3600));
  for (let i = 0; i < count; i++) {
    const x = Math.random() * cv.width;
    const y = Math.random() * cv.height;
    const r = Math.random() * 1.2 + 0.25;
    const a = Math.random() * 0.55 + 0.10;
    g.globalAlpha = a;
    g.fillStyle = Math.random() > 0.86 ? '#d4a574' : '#c4bda7';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  starCanvas = cv;
}

const items = [];
for (let i = 0; i < nodes.length; i++) items.push({ t: 0, i, d: 0 });
for (let i = 0; i < edges.length; i++) items.push({ t: 1, i, d: 0 });

/* 选中状态 */
const state = {
  selected: null,
  ancSet: new Set(),
  descSet: new Set(),
  ancAll: new Set(),
  descAll: new Set(),
  focusCluster: null,
};

let viewIsRotating = false;

function collect(start, adj, forward) {
  const seen = new Set([start]);
  const q = [start];
  while (q.length) {
    const cur = q.shift();
    const list = adj[cur];
    for (let i = 0; i < list.length; i++) {
      const e = edges[list[i]];
      const nxt = forward ? e.b : e.a;
      if (!seen.has(nxt)) { seen.add(nxt); q.push(nxt); }
    }
  }
  seen.delete(start);
  return seen;
}

function selectNode(idx) {
  if (state.selected === idx) return;
  state.selected = idx;
  if (idx == null) {
    state.ancSet = new Set(); state.descSet = new Set();
    state.ancAll = new Set(); state.descAll = new Set();
  } else {
    /* 进入节点级选中 → 清掉章节级粗筛 */
    state.focusCluster = null;
    legendItemsEl && legendItemsEl.querySelectorAll('.lg-row').forEach(r => r.classList.remove('active'));
    state.ancSet  = collect(idx, inAdj, false);
    state.descSet = collect(idx, outAdj, true);
    state.ancAll  = new Set(state.ancSet);  state.ancAll.add(idx);
    state.descAll = new Set(state.descSet); state.descAll.add(idx);
  }
  renderPanel();
}

function fog(d) {
  const near = cam.dist - 900;
  const far  = cam.dist + 1000;
  return clamp((far - d) / (far - near), 0, 1);
}

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* ── 焦点色：以被选中/悬停节点的 cluster color 为基础，派生 anc/desc/sel 三种色调 ── */
function hexToRgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgbToHex(r, g, b) {
  const h = v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0');
  return '#' + h(r) + h(g) + h(b);
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0, l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h /= 6;
  }
  return [h * 360, s * 100, l * 100];
}
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360;
  s = clamp(s, 0, 100) / 100;
  l = clamp(l, 0, 100) / 100;
  if (s === 0) return [l * 255, l * 255, l * 255];
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s;
  const p = 2 * l - q;
  const t = [h + 1/3, h, h - 1/3];
  const ch = t.map(c => {
    if (c < 0) c += 1; else if (c > 1) c -= 1;
    if (c < 1/6) return p + (q - p) * 6 * c;
    if (c < 1/2) return q;
    if (c < 2/3) return p + (q - p) * (2/3 - c) * 6;
    return p;
  });
  return [ch[0] * 255, ch[1] * 255, ch[2] * 255];
}
/* 从 hex 派生变体：deltaL 用百分比正负调亮度，deltaS 用百分比正负调饱和 */
function tint(hex, deltaL, deltaS) {
  const [r, g, b] = hexToRgb(hex);
  const [h, s, l] = rgbToHsl(r, g, b);
  const [nr, ng, nb] = hslToRgb(h, s + deltaS, l + deltaL);
  return rgbToHex(nr, ng, nb);
}

function focusColors() {
  /* 优先取悬停节点的 cluster color，其次章节筛选的 cluster color，最后取锁定选中节点 */
  let focusIdx = hovered >= 0 ? hovered : null;
  let base;
  if (focusIdx != null) {
    base = CLUSTERS[nodes[focusIdx].cluster].color;
  } else if (state.focusCluster != null) {
    base = CLUSTERS[state.focusCluster].color;
  } else if (state.selected != null) {
    base = CLUSTERS[nodes[state.selected].cluster].color;
  } else {
    return null;
  }
  /* 前置边/节点：偏暗 + 偏冷（降饱和）；后继边/节点：偏亮 + 偏暖（提饱和） */
  const dimL = currentTheme === 'light' ? -8 : -6;
  const brightL = currentTheme === 'light' ? 4 : 10;
  const dimS = -10;
  const brightS = 14;
  return {
    base,
    sel: base,
    anc: tint(base, dimL, dimS),
    desc: tint(base, brightL, brightS),
    cross: tint(base, currentTheme === 'light' ? -10 : 6, 0),
  };
}

/* ── 绘制边 ── */
function drawEdge(k) {
  const e = edges[k];
  const A = nodes[e.a], B = nodes[e.b];
  const f = fog((A._d + B._d) * 0.5);
  const avgS = (A._s + B._s) * 0.5;
  const fc = focusColors();

  if (e.kind === 'cross') {
    // 跨章节虚线
    let alpha = 0.32 * f;
    let color = fc ? fc.cross : (currentTheme === 'light' ? '#a83d27' : '#b8673f');
    let w = 1.4;
    const sel = state.selected;
    const focusCluster = state.focusCluster;
    if (focusCluster != null) {
      /* 章节过滤：跨章边至少一端在该章节才显示 */
      const hit = A.cluster === focusCluster || B.cluster === focusCluster;
      if (!hit) { alpha = 0.02; }
      else { alpha = 0.7 * f; w = 1.8; }
    } else if (sel != null) {
      const hit = state.ancAll.has(e.a) || state.descAll.has(e.a) ||
                  state.ancAll.has(e.b) || state.descAll.has(e.b);
      if (!hit) { alpha = 0.03; }
      else { alpha = 0.85 * f; w = 2; }
    }
    if (alpha < 0.01) return;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(0.5, w * avgS);
    ctx.setLineDash([6 * avgS, 4 * avgS]);
    ctx.beginPath();
    ctx.moveTo(A._sx, A._sy);
    ctx.lineTo(B._sx, B._sy);
    ctx.stroke();
    ctx.setLineDash([]);
    return;
  }

  // 树边（主题→子主题 或 章节→主题）
  let alpha, w;
  if (e.kind === 'chapter-link') {
    alpha = 0.16 * (0.35 + 0.65 * f);
    w = 0.9;
  } else {
    alpha = 0.22 * (0.35 + 0.65 * f);
    w = 1.0;
  }
  let colorA = CLUSTERS[A.cluster].color;
  let colorB = CLUSTERS[B.cluster].color;
  let glowAlpha = 0;

  const sel = state.selected;
  const focusCluster = state.focusCluster;
  if (sel != null && fc) {
    const aAnc  = state.ancAll.has(e.a)  && state.ancAll.has(e.b);
    const aDesc = state.descAll.has(e.a) && state.descAll.has(e.b);
    if (aAnc)       { alpha = 0.85 * f; colorA = colorB = fc.anc; w = 2.0; glowAlpha = 0.25 * f; }
    else if (aDesc) { alpha = 0.85 * f; colorA = colorB = fc.desc; w = 2.0; glowAlpha = 0.25 * f; }
    else            { alpha = 0.025 * f; }
  } else if (focusCluster != null && fc) {
    /* 章节过滤：两端都在该章节才高亮，否则暗淡 */
    const inCluster = A.cluster === focusCluster && B.cluster === focusCluster;
    if (inCluster) { alpha = 0.7 * f; colorA = colorB = fc.sel; w = 1.4; glowAlpha = 0.18 * f; }
    else           { alpha = 0.03 * f; }
  }

  if (alpha < 0.006) return;

  const lineW = Math.max(0.4, w * avgS);

  if (glowAlpha > 0.015) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = glowAlpha;
    ctx.strokeStyle = colorA;
    ctx.lineWidth = lineW * 3.0;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(A._sx, A._sy);
    ctx.lineTo(B._sx, B._sy);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.globalAlpha = alpha;
  if (colorA === colorB) {
    ctx.strokeStyle = colorA;
  } else {
    const grad = ctx.createLinearGradient(A._sx, A._sy, B._sx, B._sy);
    grad.addColorStop(0, colorA);
    grad.addColorStop(1, colorB);
    ctx.strokeStyle = grad;
  }
  ctx.lineWidth = lineW;
  ctx.beginPath();
  ctx.moveTo(A._sx, A._sy);
  ctx.lineTo(B._sx, B._sy);
  ctx.stroke();
}

/* ── 绘制节点 ── */
function drawNode(i) {
  const n = nodes[i];
  const f = fog(n._d);
  const base = CLUSTERS[n.cluster].color;
  const R = nodeRadius(n) * n._s;

  if (R < 0.25) return;

  const sel = state.selected;
  const isSel  = sel === i;
  const isAnc  = state.ancSet.has(i);
  const isDesc = state.descSet.has(i);
  const fc = focusColors();
  const focusCluster = state.focusCluster;
  const inFocusCluster = focusCluster == null || n.cluster === focusCluster;

  let color = base;
  let glowA = 0.75 * f;
  let bodyA = 0.30 + 0.70 * f;

  // 子主题整体更暗
  if (n.kind === 'sub') {
    glowA *= 0.55;
    bodyA *= 0.78;
  }
  // 章节节点始终高亮
  if (n.kind === 'chapter') {
    glowA = Math.max(glowA, 0.9 * f);
    bodyA = Math.max(bodyA, 0.85);
  }

  if (sel != null && fc) {
    if (isSel)        { color = fc.sel; glowA = 1.55; bodyA = 1; }
    else if (isAnc)   { color = fc.anc; glowA = 1.05 * f; bodyA = 0.42 + 0.58 * f; }
    else if (isDesc)  { color = fc.desc; glowA = 1.05 * f; bodyA = 0.42 + 0.58 * f; }
    else              { glowA = 0.04 * f;  bodyA = 0.14; }
  } else if (focusCluster != null && fc) {
    /* 章节过滤模式：仅高亮该章节节点 */
    if (inFocusCluster) { color = fc.sel; glowA = 1.0 * f; bodyA = 0.55 + 0.45 * f; }
    else                { glowA = 0.03 * f; bodyA = 0.10; }
  }

  // 光晕（仅当屏幕半径够大时绘制）
  if (glowA > 0.012 && R > 1.5) {
    const gs = R * 7.5;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.min(1, glowA);
    ctx.drawImage(getGlow(color), n._sx - gs / 2, n._sy - gs / 2, gs, gs);
    ctx.globalCompositeOperation = 'source-over';
  }

  if (n.kind === 'chapter') {
    /* 章节节点：同心双环 + 实心核，外环偏暗、内核偏亮 */
    ctx.globalAlpha = clamp(bodyA * 0.45, 0, 1);
    ctx.beginPath();
    ctx.arc(n._sx, n._sy, R * 1.15, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(0.6, R * 0.08);
    ctx.stroke();

    ctx.globalAlpha = clamp(bodyA, 0, 1);
    ctx.beginPath();
    ctx.arc(n._sx, n._sy, R * 0.72, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    /* 内圈描边 */
    ctx.globalAlpha = clamp(bodyA * 0.7, 0, 1);
    ctx.beginPath();
    ctx.arc(n._sx, n._sy, R * 0.72, 0, Math.PI * 2);
    ctx.strokeStyle = currentTheme === 'light' ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.6)';
    ctx.lineWidth = Math.max(0.5, R * 0.1);
    ctx.stroke();
  } else {
    // 实心圆盘
    ctx.globalAlpha = clamp(bodyA, 0, 1);
    ctx.beginPath();
    ctx.arc(n._sx, n._sy, R, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    // 主题节点加白色内圈
    if (n.kind === 'topic' && R > 2.5) {
      ctx.globalAlpha = clamp(bodyA * 0.55, 0, 1);
      ctx.beginPath();
      ctx.arc(n._sx, n._sy, R * 0.94, 0, Math.PI * 2);
      ctx.strokeStyle = currentTheme === 'light' ? 'rgba(245,239,222,0.6)' : 'rgba(255,255,255,0.45)';
      ctx.lineWidth = Math.max(0.5, R * 0.14);
      ctx.stroke();
    }
  }

  // 选中环：用焦点色而非固定色，让点击节点的高亮也跟随焦点色
  if (isSel) {
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.arc(n._sx, n._sy, R + 3.2, 0, Math.PI * 2);
    ctx.strokeStyle = fc ? tint(fc.sel, currentTheme === 'light' ? -22 : 18, 0) : (currentTheme === 'light' ? '#1a1a1a' : '#faf6e8');
    ctx.lineWidth = Math.max(1.1, R * 0.2);
    ctx.stroke();
  }

  // 标签
  const isHovered = hovered === i;
  /* "有效章节" = click 锁定的 focusCluster，或当前悬停的章节节点；让 hover 和 click 标签行为一致 */
  const hoveredNode = hovered >= 0 ? nodes[hovered] : null;
  const hoverFocus = hoveredNode && hoveredNode.kind === 'chapter' ? hoveredNode.cluster : null;
  const effectiveFocus = state.focusCluster != null ? state.focusCluster : hoverFocus;
  const labelInFocusCluster = effectiveFocus == null || n.cluster === effectiveFocus;
  let allowLabel = true;
  if (viewIsRotating) {
    allowLabel = (isHovered || isSel) && labelInFocusCluster;
  } else {
    /* 默认：所有 topic + 当前 chapter + 选中/悬停/前置/后继 */
    const isOwnChapter = effectiveFocus == null
      ? n.kind === 'chapter'  /* 无筛选时所有章节都显示 */
      : n.kind === 'chapter' && n.cluster === effectiveFocus;  /* 有筛选时只显示选中的章节 */
    allowLabel = (n.kind === 'topic' || isOwnChapter) || isHovered || isSel || isAnc || isDesc;
  }

  if (allowLabel && R > 3.2 && f > 0.15) {
    let fs;
    if (n.kind === 'chapter') fs = clamp(R * 1.05, 13, 20);
    else if (n.kind === 'topic') fs = clamp(R * 1.9, 10, 15);
    else fs = clamp(R * 2.4, 9, 13);
    const ly = n._sy - R - fs * 0.95;

    let la = Math.min(1, f * 1.5);
    if (sel != null && !isSel && !isAnc && !isDesc) la *= 0.10;
    if (isSel) la = 1;
    if (n.kind === 'sub' && !isHovered && !isSel && !isAnc && !isDesc) la *= 0.55;

    ctx.globalAlpha = la;
    const fontWeight = n.kind === 'chapter' ? 700 : (n.kind === 'topic' ? 600 : 500);
    ctx.font = `${fontWeight} ${fs}px ${currentTheme === 'light' || n.kind === 'chapter' ? '"Noto Serif SC","Cinzel",Inter,"PingFang SC",serif' : 'Inter,"PingFang SC","Microsoft YaHei",sans-serif'}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';

    const haloColor = currentTheme === 'light' ? 'rgba(255,255,255,0.94)' : 'rgba(6,9,26,0.94)';
    ctx.strokeStyle = haloColor;
    ctx.lineWidth = fs * 0.32;
    ctx.strokeText(n.label, n._sx, ly);

    const labelBase  = currentTheme === 'light' ? '#1a1a1a' : '#d2def5';
    const labelSub   = currentTheme === 'light' ? '#4d4a40' : '#98a9c4';
    /* 选中/前置/后继的标签颜色：从焦点色派生，让标签也跟焦点色调一致 */
    let labelAnc, labelDesc, labelSel;
    if (fc) {
      labelAnc  = tint(fc.anc,  currentTheme === 'light' ? -8 : 8, 0);
      labelDesc = tint(fc.desc, currentTheme === 'light' ? -10 : 4, 0);
      labelSel  = tint(fc.sel,  currentTheme === 'light' ? -10 : 6, 0);
    } else {
      labelAnc  = currentTheme === 'light' ? '#6f5421' : '#e8c384';
      labelDesc = currentTheme === 'light' ? '#3f6b53' : '#8ff0b6';
      labelSel  = currentTheme === 'light' ? '#1a1a1a' : '#ffffff';
    }
    ctx.fillStyle = isSel ? labelSel
                  : isAnc ? labelAnc
                  : isDesc ? labelDesc
                  : n.kind === 'chapter'
                      ? tint(base, currentTheme === 'light' ? -25 : 8, -10)
                      : n.kind === 'topic' ? labelBase : labelSub;
    ctx.fillText(n.label, n._sx, ly);
  }
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (starCanvas) {
    ctx.globalAlpha = 1;
    ctx.drawImage(starCanvas, 0, 0, W, H);
  }

  // 深度排序
  for (let k = 0; k < items.length; k++) {
    const it = items[k];
    if (it.t === 0) {
      it.d = nodes[it.i]._d;
    } else {
      const e = edges[it.i];
      it.d = (nodes[e.a]._d + nodes[e.b]._d) * 0.5 + (e.kind === 'cross' ? -100 : 0.5);
    }
  }
  items.sort((a, b) => b.d - a.d);

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let k = 0; k < items.length; k++) {
    const it = items[k];
    if (it.t === 1) drawEdge(it.i);
    else            drawNode(it.i);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ══════════════════════════════════════════════
   视图适配
   ══════════════════════════════════════════════ */

function computeFit() {
  updateCamTrig();
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of nodes) {
    const x1 =  n.x * _cosY + n.z * _sinY;
    const z1 = -n.x * _sinY + n.z * _cosY;
    const y2 =  n.y * _cosP - z1 * _sinP;
    const z2 =  n.y * _sinP + z1 * _cosP;
    const d  = cam.dist - z2;
    const s  = FOCAL / Math.max(d, 120);
    const sx = x1 * s, sy = y2 * s;
    if (sx < minX) minX = sx;
    if (sx > maxX) maxX = sx;
    if (sy < minY) minY = sy;
    if (sy > maxY) maxY = sy;
  }
  const pad = 80;
  const bw = Math.max(maxX - minX, 1);
  const bh = Math.max(maxY - minY, 1);
  cam.zoom = clamp(Math.min((W - pad * 2) / bw, (H - pad * 2) / bh), 0.10, 3.5);
  cam.tx = -(minX + maxX) / 2 * cam.zoom;
  cam.ty = -(minY + maxY) / 2 * cam.zoom;
  cam.txT = cam.tx;
  cam.tyT = cam.ty;
}

function focusNode(i) {
  updateCamTrig();
  const n = nodes[i];
  const x1 =  n.x * _cosY + n.z * _sinY;
  const z1 = -n.x * _sinY + n.z * _cosY;
  const y2 =  n.y * _cosP - z1 * _sinP;
  const z2 =  n.y * _sinP + z1 * _cosP;
  const d  = cam.dist - z2;
  const s  = FOCAL / Math.max(d, 120) * cam.zoom;
  cam.txT = -x1 * s;
  cam.tyT = -y2 * s;
}

/* ══════════════════════════════════════════════
   交互
   ══════════════════════════════════════════════ */

let hovered = -1;
let lockedSelected = null;
let dragging = null;
let orbiting = false;
let panning = false;
let lastP = { x: 0, y: 0 };
let downP = { x: 0, y: 0 };
let moved = false;
let liveAlpha = 0;

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function pick(sx, sy) {
  let best = -1, bestScore = Infinity;
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    const dx = n._sx - sx, dy = n._sy - sy;
    const d2 = dx * dx + dy * dy;
    // 章节 > 主题 > 子：点击时优先选层级更高的节点
    const priority = n.kind === 'chapter' ? 0.35 : n.kind === 'topic' ? 0.6 : 1.0;
    const score = d2 * priority * (0.7 + 0.3 * (n._d / cam.dist));
    if (score < bestScore) { bestScore = score; best = i; }
  }
  if (best < 0) return -1;
  const n = nodes[best];
  const R = nodeRadius(n) * n._s;
  const thresh = Math.max(9, R + 6);
  return bestScore < thresh * thresh ? best : -1;
}

function refreshActive() {
  selectNode(hovered >= 0 ? hovered : lockedSelected);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const p = getPos(e);
  const hit = pick(p.x, p.y);
  moved = false;
  downP = p;
  lastP = p;

  if (hit >= 0 && !e.shiftKey) {
    /* 章节节点与主题/子点行为一致：锁选中 + 可拖拽 + 显示节点详情
       （章节的"后继"即其下属主题）；章节筛选模式仅通过左侧图例切换 */
    dragging = hit;
    nodes[hit].fixed = true;
    liveAlpha = 0.5;
    lockedSelected = hit;
    hovered = hit;
    refreshActive();
    canvas.classList.add('grabbing');
  } else if (e.shiftKey || e.button === 2) {
    panning = true;
    canvas.classList.add('grabbing');
  } else {
    orbiting = true;
    canvas.classList.add('grabbing');
  }
});

canvas.addEventListener('pointermove', e => {
  const p = getPos(e);
  const dx = p.x - lastP.x, dy = p.y - lastP.y;
  if (Math.abs(p.x - downP.x) + Math.abs(p.y - downP.y) > 4) moved = true;

  if (dragging != null) {
    const n = nodes[dragging];
    const s = n._s || 1;
    const dxc = dx / s, dyc = dy / s;
    const wx =  _cosY * dxc + _sinP * _sinY * dyc;
    const wy =  _cosP * dyc;
    const wz =  _sinY * dxc - _sinP * _cosY * dyc;
    n.x += wx; n.y += wy; n.z += wz;
    n.vx = n.vy = n.vz = 0;
  } else if (orbiting) {
    cam.yaw += dx * 0.0060;
    cam.pitch = clamp(cam.pitch - dy * 0.0060, -1.45, 1.45);
    cam.txT = cam.tx; cam.tyT = cam.ty;
  } else if (panning) {
    cam.tx += dx; cam.ty += dy;
    cam.txT = cam.tx; cam.tyT = cam.ty;
  } else {
    const pickHit = pick(p.x, p.y);
    /* 锁选中节点时：仅锁中节点响应 hover，其他节点的 hover 效果（tooltip / 面板 / 光标）均不生效 */
    const hit = lockedSelected != null && pickHit !== lockedSelected ? -1 : pickHit;
    if (hit !== hovered) {
      hovered = hit;
      canvas.classList.toggle('hot', hit >= 0);
      if (hit >= 0) {
        tooltip.textContent = nodes[hit].label;
        tooltip.style.display = 'block';
      } else {
        tooltip.style.display = 'none';
      }
      refreshActive();
    }
    if (hit >= 0) {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY + 14) + 'px';
    }
  }

  lastP = p;
});

function endPointer() {
  if (dragging != null) {
    nodes[dragging].fixed = false;
    dragging = null;
  } else if ((orbiting || panning) && !moved) {
    lockedSelected = null;
    refreshActive();
  }
  orbiting = false;
  panning = false;
  canvas.classList.remove('grabbing');
}

canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('pointerleave', () => {
  hovered = -1;
  tooltip.style.display = 'none';
  canvas.classList.remove('hot');
  refreshActive();
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.zoom = clamp(cam.zoom * Math.exp(-e.deltaY * 0.0013), 0.08, 5);
}, { passive: false });

window.addEventListener('resize', () => { resize(); computeFit(); });

/* ══════════════════════════════════════════════
   侧栏面板
   ══════════════════════════════════════════════ */

function renderPanel() {
  const idx = state.selected;
  if (idx == null) {
    /* 章节过滤态：显示章节概览 */
    if (state.focusCluster != null) {
      const c = CLUSTERS[state.focusCluster];
      const allNodes = nodes.filter(n => n.cluster === state.focusCluster);
      const topicCount = allNodes.filter(n => n.kind === 'topic').length;
      const subCount = allNodes.filter(n => n.kind === 'sub').length;
      const topicChips = allNodes.filter(n => n.kind === 'topic').map(n =>
        `<span class="chip" data-id="${n.id}" title="${n.label}">${n.label}</span>`
      ).join('');
      panelBody.innerHTML =
        '<div class="node-title">' +
          '<span class="dot" style="background:' + c.color + ';color:' + c.color + '"></span>' +
          '<h2>' + c.name + '</h2>' +
        '</div>' +
        '<div class="path">章节筛选模式</div>' +
        '<span class="badge" style="color:' + c.color + '">' + topicCount + ' 主题 · ' + subCount + ' 子点</span>' +
        '<div class="section"><h3>主题</h3><div class="chips">' + topicChips + '</div></div>' +
        '<div class="hint" style="font-family:var(--font-mono);font-size:11px;margin-top:14px;color:var(--ivory-3);line-height:1.8">' +
          '再次点击章节图例可取消筛选<br>点击任意节点切换到节点详情' +
        '</div>';
      return;
    }
    panelBody.innerHTML =
      '<div class="empty">' +
      '<div class="ei">⌬</div>' +
      '悬停或点击任意节点<br>查看它的知识依赖链' +
      '<div class="hint">' +
      '<span class="kbd" style="display:inline-block;padding:1px 6px;border:1px solid var(--ink-4);border-radius:3px;background:var(--ink-2);color:var(--gold-2);font-family:var(--font-mono);font-size:10px">T</span> 切换主题<br>' +
      '点击章节图例 → 章节筛选' +
      '</div>' +
      '</div>';
    return;
  }

  const n = nodes[idx];
  const meta = nodeMeta.get(n.id) || {};
  const col = CLUSTERS[n.cluster];

  const pre  = inAdj[idx].map(ei => edges[ei].a);
  const post = outAdj[idx].map(ei => edges[ei].b);

  const chip = (i, cls) =>
    `<span class="chip ${cls}" data-id="${nodes[i].id}" title="${nodes[i].label}">${nodes[i].label}</span>`;

  panelBody.innerHTML = `
    <div class="node-title">
      <span class="dot" style="background:${col.color};color:${col.color}"></span>
      <h2>${n.label}</h2>
    </div>
    <div class="path">${meta.chapter || ''}${meta.topic ? ' · ' + meta.topic : ''}</div>
    <span class="badge" style="color:${col.color}">${col.name}</span>

    <div class="stats">
      <div><b>${pre.length}</b><span>前置</span></div>
      <div><b>${post.length}</b><span>后继</span></div>
      <div><b>${state.ancSet.size}</b><span>全部前置</span></div>
    </div>

    ${pre.length ? `
    <div class="section">
      <h3>前置</h3>
      <div class="chips">${pre.map(i => chip(i, 'anc')).join('')}</div>
    </div>` : ''}

    ${post.length ? `
    <div class="section">
      <h3>后继</h3>
      <div class="chips">${post.map(i => chip(i, 'desc')).join('')}</div>
    </div>` : ''}
  `;
}

panelBody.addEventListener('click', e => {
  const el = e.target.closest('.chip');
  if (!el) return;
  const i = idToIndex.get(el.dataset.id);
  if (i != null) {
    lockedSelected = i;
    hovered = -1;
    refreshActive();
    focusNode(i);
  }
});

document.getElementById('btn-fit').addEventListener('click', () => {
  releaseHoverLock();
  computeFit();
});

const btnSpin = document.getElementById('btn-spin');
let autoRotate = true;
/* 释放 hover 锁：清掉 lockedSelected 并将面板节点详情也一并清空，
   使 hover 立即对所有节点生效 */
function releaseHoverLock() {
  if (lockedSelected == null && state.selected == null) return;
  lockedSelected = null;
  hovered = -1;
  tooltip.style.display = 'none';
  canvas.classList.remove('hot');
  if (state.selected != null) {
    state.selected = null;
    state.ancSet = new Set();
    state.descSet = new Set();
    state.ancAll = new Set();
    state.descAll = new Set();
    renderPanel();
  }
}
btnSpin.addEventListener('click', () => {
  releaseHoverLock();
  autoRotate = !autoRotate;
  btnSpin.classList.toggle('on', autoRotate);
});

/* 图例 */
const legendItemsEl = document.getElementById('legend-items');
legendItemsEl.innerHTML = clusterKeys.map(k => {
  const c = CLUSTERS[k];
  const cnt = nodes.filter(n => n.cluster === k).length;
  return `<div class="lg-row" data-cluster="${k}"><i style="background:${c.color};box-shadow:0 0 8px ${c.color}"></i><span>${c.name} · ${cnt}</span></div>`;
}).join('');

legendItemsEl.addEventListener('click', e => {
  const row = e.target.closest('.lg-row');
  if (!row) return;
  const cid = row.dataset.cluster;
  if (!cid) return;
  /* 切换：再点同一章节 → 取消 */
  if (state.focusCluster === cid) {
    state.focusCluster = null;
    state.selected = null;
    state.ancSet = new Set();
    state.descSet = new Set();
    state.ancAll = new Set();
    state.descAll = new Set();
    lockedSelected = null;
  } else {
    state.focusCluster = cid;
    state.selected = null;
    state.ancSet = new Set();
    state.descSet = new Set();
    state.ancAll = new Set();
    state.descAll = new Set();
    lockedSelected = null;
  }
  legendItemsEl.querySelectorAll('.lg-row').forEach(r => {
    r.classList.toggle('active', r.dataset.cluster === state.focusCluster);
  });
  renderPanel();
});

/* 顶部统计 */
document.getElementById('stat-line').textContent =
  `${nodes.length} 个节点 · ${edges.length} 条关系 · ${chapters.length} 章 · 包含章节/主题/子点`;

/* ══════════════════════════════════════════════
   主题切换
   ══════════════════════════════════════════════ */

const THEME_KEY = 'kg-theme';
const PALETTE_DARK  = ['#d4a574','#c8553d','#5d8a6f','#4a6fa5','#b8673f','#6f5d8a','#c8956a','#5a7d8a','#3d8a6b','#9c6b8a','#8b6f3e','#e8c384','#c4bda7','#b88a52','#8e8a7a','#7d8aa6','#d8a48f','#a89572','#7aa28e'];
const PALETTE_LIGHT = ['#8a6a2c','#a83d27','#3f6b53','#355080','#8a4828','#564268','#9a6a3e','#3d5666','#28604a','#7a4a68','#5a4820','#6a5020','#5a5038','#5a4020','#5a5448','#3d4a6a','#a87a55','#7a6028','#3f6b53'];

let currentTheme = 'dark';

function applyTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = theme === 'light' ? '☀' : '☾';
  const palette = theme === 'light' ? PALETTE_LIGHT : PALETTE_DARK;
  clusterKeys.forEach((cid, i) => {
    CLUSTERS[cid].color = palette[i % palette.length];
  });
  buildStars();
}

window.toggleTheme = function() {
  const next = currentTheme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
  applyTheme(next);
};

try {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) applyTheme(saved);
  else applyTheme('dark');
} catch(e) { applyTheme('dark'); }

document.getElementById('theme-toggle').addEventListener('click', window.toggleTheme);

document.addEventListener('keydown', function(e) {
  if ((e.key === 't' || e.key === 'T') && !e.ctrlKey && !e.metaKey && !e.altKey
      && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) {
    window.toggleTheme();
  }
});

/* ══════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════ */

resize();
selectNode(null);

// 构建期烘焙：只跑 25 步
for (let i = 0; i < 25; i++) simulate(0.6 - (i / 25) * 0.55, true);

computeFit();

function frame() {
  const isHovering = hovered >= 0;
  const isSelected = state.selected != null;
  const isBusy = dragging != null || orbiting || panning;
  const autoSpinning = autoRotate && !isHovering && !isSelected && !isBusy;
  viewIsRotating = autoSpinning || orbiting;

  if (autoSpinning) cam.yaw += 0.0015;

  cam.tx += (cam.txT - cam.tx) * 0.11;
  cam.ty += (cam.tyT - cam.ty) * 0.11;

  if (dragging != null) liveAlpha = 0.4;
  if (liveAlpha > 0.002) {
    simulate(liveAlpha, false);
    if (dragging == null) liveAlpha *= 0.93;
  } else {
    liveAlpha = 0;
  }

  updateCamTrig();
  for (let i = 0; i < nodes.length; i++) project(nodes[i]);

  draw();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

/* ══════════════════════════════════════════════
   主题切换
   ══════════════════════════════════════════════ */

})();
</script>
</script>
