<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>考点缩写全景 v2 · 系统架构设计师</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root {
  --ink-0: #06091a;
  --ink-1: #0a0f1f;
  --ink-2: #131a2e;
  --ink-3: #1c2440;
  --ink-4: #2a3056;
  --gold-1: #e8c384;
  --gold-2: #d4a574;
  --gold-3: #b88a52;
  --gold-4: #8b6f3e;
  --ivory-0: #faf6e8;
  --ivory-1: #f5f0e1;
  --ivory-2: #c4bda7;
  --ivory-3: #8e8a7a;
  --crimson: #c8553d;
  --emerald: #5d8a6f;
  --azure: #4a6fa5;
  --violet: #6f5d8a;
  --amber-deep: #b8673f;
  --copper: #c8956a;
  --steel: #5a7d8a;
  --deep-emerald: #3d8a6b;
  --mauve: #9c6b8a;
  --ink-1-rgb: 10, 15, 31;
  --font-display: 'Cinzel', 'Noto Serif SC', serif;
  --font-body: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'Consolas', monospace;
  --font-cn: 'Noto Serif SC', 'Songti SC', serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--ink-0);
  font-family: var(--font-body);
  color: var(--ivory-1);
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(212, 165, 116, 0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(74, 111, 165, 0.08) 0%, transparent 50%);
  background-attachment: fixed;
  overflow: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(212, 165, 116, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212, 165, 116, 0.02) 1px, transparent 1px);
  background-size: 64px 64px;
  pointer-events: none; z-index: 0;
}

/* ===== Header ===== */
header {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 50;
  padding: 16px 28px;
  background: rgba(var(--ink-1-rgb), 0.85);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border-bottom: 1px solid var(--ink-4);
  display: flex; align-items: center; gap: 18px;
}
.brand {
  font-family: var(--font-display);
  font-size: 0.74rem; letter-spacing: 0.32em;
  text-transform: uppercase; color: var(--gold-3);
  flex: 0 0 auto;
}
.brand::before {
  content: ''; display: inline-block;
  width: 8px; height: 8px;
  background: var(--gold-2);
  border-radius: 50%;
  margin-right: 12px;
  vertical-align: middle;
  box-shadow: 0 0 8px var(--gold-2);
}
h1 {
  font-family: var(--font-cn);
  font-weight: 700; font-size: 1.15rem;
  color: var(--ivory-0); margin: 0;
  letter-spacing: 0.04em;
}
.stat-strip {
  display: flex; gap: 12px;
  margin-left: auto;
  font-family: var(--font-display);
  font-size: 0.72rem;
  letter-spacing: 0.18em;
}
.stat-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: rgba(212, 165, 116, 0.06);
  border: 1px solid rgba(212, 165, 116, 0.18);
  border-radius: 12px;
  color: var(--ivory-2);
}
.stat-pill strong {
  color: var(--gold-2);
  font-weight: 700;
  font-family: var(--font-mono);
}
.search-box {
  position: relative;
  width: 240px;
}
.search-box input {
  width: 100%;
  padding: 7px 12px 7px 32px;
  background: rgba(19, 26, 46, 0.7);
  border: 1px solid var(--ink-4);
  border-radius: 16px;
  color: var(--ivory-1);
  font-family: var(--font-body);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input::placeholder { color: var(--ivory-3); }
.search-box input:focus { border-color: var(--gold-3); }
.search-box::before {
  content: '⌕';
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--gold-3);
  font-size: 1rem;
  pointer-events: none;
}

/* ===== Layout ===== */
main {
  position: fixed;
  top: 65px; bottom: 0;
  left: 0; right: 0;
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 0;
  z-index: 1;
}
#chart-wrap {
  position: relative;
  padding: 0;
  border-right: 1px solid var(--ink-4);
}
#chart { width: 100%; height: 100%; }
#chart-title {
  position: absolute;
  top: 14px; left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
  z-index: 5;
}
#chart-title .t1 {
  font-family: var(--font-cn);
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--ivory-0);
  letter-spacing: 0.04em;
}
#chart-title .t2 {
  font-family: var(--font-display);
  font-size: 0.66rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ivory-3);
  margin-top: 3px;
}
.breadcrumb {
  position: absolute;
  bottom: 16px; left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono);
  font-size: 0.74rem;
  background: rgba(10, 15, 31, 0.7);
  border: 1px solid var(--ink-4);
  border-radius: 14px;
  padding: 5px 14px;
  color: var(--ivory-2);
  z-index: 5;
  white-space: nowrap;
}
.breadcrumb .crumb {
  cursor: pointer;
  color: var(--ivory-2);
  transition: color 0.15s;
}
.breadcrumb .crumb:hover { color: var(--gold-2); }
.breadcrumb .sep { color: var(--ink-4); }
.breadcrumb .crumb.active { color: var(--gold-2); font-weight: 600; }

/* ===== Detail panel ===== */
aside {
  background: linear-gradient(180deg, var(--ink-1), var(--ink-0));
  overflow-y: auto;
  padding: 18px 20px 30px;
}
aside::-webkit-scrollbar { width: 6px; }
aside::-webkit-scrollbar-track { background: transparent; }
aside::-webkit-scrollbar-thumb { background: var(--ink-4); border-radius: 3px; }

.panel-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--ivory-3);
}
.panel-empty .glyph {
  font-size: 2.5rem;
  color: var(--ink-4);
  margin-bottom: 12px;
}
.panel-empty .msg {
  font-family: var(--font-display);
  font-size: 0.74rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ivory-3);
}
.panel-empty .hint {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  margin-top: 16px;
  color: var(--ivory-3);
  line-height: 1.8;
}
.panel-empty .hint .kbd {
  display: inline-block;
  padding: 1px 6px;
  border: 1px solid var(--ink-4);
  border-radius: 3px;
  background: var(--ink-2);
  color: var(--gold-2);
  font-size: 0.7rem;
}

.tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.freq-tag {
  font-family: var(--font-display);
  font-size: 0.66rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid;
}
.freq-5 { color: #ff6b6b; border-color: rgba(255,107,107,0.4); background: rgba(255,107,107,0.08); }
.freq-4 { color: var(--gold-2); border-color: rgba(212,165,116,0.4); background: rgba(212,165,116,0.08); }
.freq-3 { color: var(--azure); border-color: rgba(74,111,165,0.4); background: rgba(74,111,165,0.08); }
.freq-2 { color: var(--ivory-3); border-color: rgba(142,138,122,0.3); background: rgba(142,138,122,0.05); }

.cat-tag {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(255,255,255,0.04);
  color: var(--ivory-2);
}

.detail-name {
  font-family: var(--font-mono);
  font-size: 2.2rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--ivory-0);
  margin: 8px 0 4px;
  line-height: 1.1;
}
.detail-zh {
  font-family: var(--font-cn);
  font-size: 1.05rem;
  font-weight: 500;
  color: var(--gold-1);
  line-height: 1.6;
  margin-bottom: 18px;
}

.section-label {
  font-family: var(--font-display);
  font-size: 0.66rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold-3);
  margin: 18px 0 8px;
  display: flex; align-items: center; gap: 6px;
}
.section-label::before {
  content: ''; width: 14px; height: 1px;
  background: var(--gold-3);
}
.detail-body {
  font-family: var(--font-body);
  font-size: 0.88rem;
  line-height: 1.7;
  color: var(--ivory-1);
  background: var(--ink-2);
  border-left: 2px solid var(--gold-3);
  padding: 10px 14px;
  border-radius: 0 4px 4px 0;
}
.tip-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 10px;
}
.tip-card {
  background: var(--ink-2);
  border: 1px solid var(--ink-4);
  border-radius: 4px;
  padding: 10px 12px;
}
.tip-card .lbl {
  font-family: var(--font-display);
  font-size: 0.62rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold-3);
  margin-bottom: 4px;
}
.tip-card .val {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--ivory-1);
}
.related-list {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.related-chip {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  padding: 4px 10px;
  border-radius: 12px;
  background: var(--ink-3);
  border: 1px solid var(--ink-4);
  color: var(--ivory-1);
  cursor: pointer;
  transition: all 0.15s;
}
.related-chip:hover {
  background: var(--ink-4);
  border-color: var(--gold-3);
  color: var(--gold-2);
}

/* ===== 记忆口诀 / 知识点展开 ===== */
.mnemonic-card {
  background: linear-gradient(135deg, rgba(212,165,116,0.08), rgba(74,111,165,0.06));
  border: 1px solid var(--gold-3);
  border-radius: 4px;
  padding: 12px 14px;
  margin-top: 6px;
}
.mnemonic-card .verse {
  font-family: var(--font-cn);
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--gold-1);
  line-height: 1.7;
  letter-spacing: 0.02em;
  text-align: center;
  padding: 4px 0;
}
.mnemonic-card .verse em {
  font-style: normal;
  color: var(--crimson);
}
.mnemonic-card .gloss {
  font-family: var(--font-body);
  font-size: 0.78rem;
  color: var(--ivory-2);
  line-height: 1.6;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed rgba(212,165,116,0.25);
}

.kn-detail {
  background: var(--ink-2);
  border: 1px solid var(--ink-4);
  border-radius: 4px;
  margin-top: 6px;
}
.kn-detail + .kn-detail { margin-top: 6px; }
.kn-detail summary {
  cursor: pointer;
  padding: 10px 14px;
  font-family: var(--font-display);
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold-2);
  list-style: none;
  display: flex; align-items: center; gap: 6px;
  user-select: none;
  transition: color 0.15s;
}
.kn-detail summary::-webkit-details-marker { display: none; }
.kn-detail summary::before {
  content: '▸';
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--gold-3);
  transition: transform 0.15s;
}
.kn-detail[open] summary::before { transform: rotate(90deg); }
.kn-detail summary:hover { color: var(--gold-1); }
.kn-detail .kn-body {
  padding: 0 14px 12px 32px;
  font-family: var(--font-body);
  font-size: 0.85rem;
  line-height: 1.7;
  color: var(--ivory-1);
}
.kn-detail .kn-body ul {
  margin: 4px 0; padding-left: 18px;
}
.kn-detail .kn-body li { margin: 2px 0; }
.kn-detail .kn-body code {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  background: var(--ink-3);
  padding: 1px 6px;
  border-radius: 3px;
  color: var(--gold-2);
}
.kn-detail .kn-body .vs {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px; align-items: center;
  background: var(--ink-3);
  border-radius: 4px;
  padding: 8px 10px;
  margin: 6px 0;
  font-size: 0.82rem;
}
.kn-detail .kn-body .vs .lhs { color: var(--gold-2); text-align: right; }
.kn-detail .kn-body .vs .rhs { color: var(--azure); }
.kn-detail .kn-body .vs .sep {
  font-family: var(--font-display);
  color: var(--crimson);
  font-size: 0.7rem;
  letter-spacing: 0.15em;
}

/* ===== Search results dropdown ===== */
.search-results {
  position: absolute;
  top: 100%; left: 0; right: 0;
  margin-top: 4px;
  max-height: 360px;
  overflow-y: auto;
  background: rgba(10, 15, 31, 0.98);
  border: 1px solid var(--gold-3);
  border-radius: 4px;
  z-index: 60;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  display: none;
}
.search-results.show { display: block; }
.search-result {
  padding: 8px 12px;
  cursor: pointer;
  border-bottom: 1px solid var(--ink-3);
  transition: background 0.15s;
  font-size: 0.82rem;
}
.search-result:hover { background: var(--ink-3); }
.search-result:last-child { border-bottom: none; }
.search-result .abbr {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--gold-2);
  margin-right: 6px;
}
.search-result .cat {
  font-family: var(--font-display);
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ivory-3);
  margin-left: 6px;
}
.search-result .zh {
  color: var(--ivory-2);
  font-size: 0.78rem;
  margin-top: 2px;
}

/* ===== Bottom legend ===== */
.legend {
  position: fixed;
  bottom: 0; left: 0; right: 380px;
  padding: 10px 24px;
  background: rgba(var(--ink-1-rgb), 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--ink-4);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  font-size: 0.72rem;
  z-index: 30;
}
.legend-item {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-display);
  letter-spacing: 0.12em;
  color: var(--ivory-2);
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 3px;
  transition: background 0.15s;
}
.legend-item:hover { background: var(--ink-3); color: var(--ivory-0); }
.legend-item.active { background: var(--ink-3); color: var(--gold-2); border-left: 2px solid var(--gold-2); padding-left: 6px; }
.legend-item.dim { opacity: 0.35; }
.legend-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex: 0 0 auto;
}
.legend-count {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--ivory-3);
}

@media (max-width: 980px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 280px; }
  aside { border-top: 1px solid var(--ink-4); }
  .legend { right: 0; }
  .stat-strip { display: none; }
  .search-box { width: 180px; }
}

/* ===== Light Theme (ink ↔ ivory flip) ===== */
[data-theme="light"] {
  --ink-0: #f5efde;
  --ink-1: #ebe4cf;
  --ink-2: #ddd2b3;
  --ink-3: #c9bd9a;
  --ink-4: #a89a72;
  --gold-1: #8a6a2c;
  --gold-2: #a07a32;
  --gold-3: #6f5421;
  --gold-4: #4a3814;
  --gold-5: #2e2208;
  --ivory-0: #1a1a1a;
  --ivory-1: #2a2a2a;
  --ivory-2: #4d4a40;
  --ivory-3: #6f6b5d;
  --crimson: #a83d27;
  --emerald: #3f6b53;
  --azure: #355080;
  --violet: #564268;
  --ink-1-rgb: 235, 228, 207;
}

[data-theme="light"] header,
[data-theme="light"] .legend {
  background: rgba(var(--ink-1-rgb), 0.88);
  border-color: var(--ink-3);
}

[data-theme="light"] body {
  background-image:
    radial-gradient(ellipse at 30% 20%, rgba(140, 100, 40, 0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 70% 80%, rgba(53, 80, 128, 0.08) 0%, transparent 55%);
}

[data-theme="light"] header,
[data-theme="light"] aside,
[data-theme="light"] .legend,
[data-theme="light"] #chart-title,
[data-theme="light"] .panel,
[data-theme="light"] .search-box input,
[data-theme="light"] .search-results,
[data-theme="light"] .breadcrumb .crumb {
  border-color: var(--ink-3);
}

[data-theme="light"] .search-box input,
[data-theme="light"] .search-results {
  background: var(--ink-1);
  color: var(--ivory-1);
}

[data-theme="light"] .kbd {
  background: var(--ink-1);
  color: var(--ivory-1);
  border-color: var(--ink-3);
}

/* ===== Theme toggle button ===== */
.theme-toggle {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 9999;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--ink-4);
  background: var(--ink-2);
  color: var(--gold-1);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  transition: all 0.2s var(--ease-out);
  box-shadow: 0 2px 8px rgba(0,0,0,0.35);
}
.theme-toggle:hover {
  border-color: var(--gold-1);
  background: var(--ink-3);
  transform: rotate(15deg);
}
[data-theme="light"] .theme-toggle {
  box-shadow: 0 2px 6px rgba(60,40,10,0.18);
}

@media print {
  body, html { background: white !important; color: #1a1a1a !important; }
  .theme-toggle, .legend, .search-box, header { display: none !important; }
  [data-theme="light"] { --ink-0:#fff; --ink-1:#fff; --ink-2:#f7f3e8; --ink-3:#d4c9a5; --ink-4:#a89a72; --ivory-0:#1a1a1a; --ivory-1:#1a1a1a; }
}
</style>
</head>
<body>

<header>
  <span class="brand">Abbreviations · v2</span>
  <h1>考点缩写全景</h1>
  <div class="stat-strip">
    <div class="stat-pill"><strong>13</strong> 类</div>
    <div class="stat-pill"><strong>394</strong> 缩写</div>
    <div class="stat-pill"><strong>90%+</strong> 真题覆盖</div>
  </div>
  <div class="search-box">
    <input id="search-input" placeholder="搜缩写或中文…" autocomplete="off" />
    <div class="search-results" id="search-results"></div>
  </div>
</header>

<main>
  <div id="chart-wrap">
    <div id="chart-title">
      <div class="t1">系统架构设计师 · 考点英文缩写</div>
      <div class="t2">Click to drill · Esc to return · Hover for details</div>
    </div>
    <div id="chart"></div>
    <div class="breadcrumb" id="breadcrumb">
      <span class="crumb active" data-level="0">系统架构师</span>
    </div>
  </div>
  <aside id="aside">
    <div class="panel-empty">
      <div class="glyph">⌬</div>
      <div class="msg">未选中缩写</div>
      <div class="hint">
        悬停查看简释<br>
        点击分类/缩写查看详情<br>
        <span class="kbd">/</span> 搜索 · <span class="kbd">Esc</span> 返回
      </div>
    </div>
  </aside>
</main>

<div class="legend" id="legend"></div>

<script>
// ============== 数据：13 类 / 394 缩写（来自 abbreviations-sunburst.html）==============

// ============== 状态 ==============
let currentRoot = null; // 当前下钻的 catId
let selectedItem = null;

// 构造 [rootNode, catNode, itemNode] 形式的 treePathInfo，供 sunburstSelect 使用
function findTreePath(name, catId) {
  const cat = CATS.find(c => c.id === catId);
  if (!cat) return null;
  const it = cat.items.find(i => i.n === name);
  if (!it) return null;
  if (currentRoot) {
    return [
      { name: CAT_NAMES[currentRoot], catId: 'cat-root' },
      { name: CAT_NAMES[currentRoot], catId: currentRoot },
      { name: it.n, catId: catId }
    ];
  }
  return [
    { name: '系统架构师', catId: 'root' },
    { name: CAT_NAMES[catId], catId: catId },
    { name: it.n, catId: catId }
  ];
}

// ============== 渲染 ==============
function render() {
  myChart.setOption(buildOption(currentRoot), true);
  updateBreadcrumb();
  updateLegendActive();
  // 重置详情面板（除非有选中项）
  if (!selectedItem) {
    showEmpty();
  } else {
    // setOption 后重新触发高亮
    const path = findTreePath(selectedItem.name, selectedItem.catId);
    if (path) {
      myChart.dispatchAction({
        type: 'sunburstSelect',
        seriesIndex: 0,
        data: [{ name: path[2].name, catId: selectedItem.catId }],
        treePathInfo: path
      });
    }
  }
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!currentRoot) {
    bc.innerHTML = '<span class="crumb active" data-level="0">系统架构师</span>';
    return;
  }
  bc.innerHTML = `
    <span class="crumb" data-level="0">系统架构师</span>
    <span class="sep">›</span>
    <span class="crumb active">${CAT_NAMES[currentRoot]}</span>
  `;
}

document.getElementById('breadcrumb').addEventListener('click', (e) => {
  const c = e.target.closest('.crumb');
  if (!c || c.classList.contains('active')) return;
  if (c.dataset.level === '0') {
    currentRoot = null;
    selectedItem = null;
    render();
  }
});

// ============== 点击事件 ==============
myChart.on('click', function (params) {
  if (!params) return;
  const info = params.treePathInfo || [];
  const depth = info.length - 1;
  // 合并 treePathInfo[depth] + params.data（drilled 模式下 params.data 可能给 wrapper）
  const node = Object.assign({}, info[depth] || {}, params.data || {});
  if (!node || (!node.name && !node.catId)) return;

  // 1) 命中具体缩写（有 zh）→ 始终打开详情面板（最优先）
  if (node.zh) {
    selectItem(node, depth);
    return;
  }

  // 2) 否则处理导航
  if (currentRoot) {
    // 下钻视图：点到 wrapper（depth=0 或 catId='cat-root'）= 返回根
    if (depth === 0 || node.catId === 'cat-root') {
      currentRoot = null;
      selectedItem = null;
      render();
    }
  } else {
    // 根视图：点到分类（catId 是真实分类 id）= 下钻
    const realCat = node.catId && node.catId !== 'root' && CATS.some(c => c.id === node.catId);
    if (realCat) {
      currentRoot = node.catId;
      selectedItem = null;
      render();
    }
  }
});

function selectItem(data, depth) {
  selectedItem = data;
  // 让 sunburst 选中状态保持高亮（即使鼠标移走也不消失）
  myChart.dispatchAction({ type: 'sunburstUnselect', seriesIndex: 0 });
  const targetPath = findTreePath(data.name, data.catId);
  if (targetPath) {
    myChart.dispatchAction({
      type: 'sunburstSelect',
      seriesIndex: 0,
      data: [{ name: targetPath[2].name, catId: data.catId }],
      treePathInfo: targetPath
    });
  }
  const cat = CATS.find(c => c.id === data.catId);
  showDetail({
    name: data.name,
    zh: data.zh,
    freq: data.freq,
    catName: cat ? CAT_NAMES[cat.id] : '',
    catColor: cat ? cat.color : '#888',
    catId: data.catId
  });
}

function showEmpty() {
  document.getElementById('aside').innerHTML = `
    <div class="panel-empty">
      <div class="glyph">⌬</div>
      <div class="msg">未选中缩写</div>
      <div class="hint">
        悬停查看简释<br>
        点击分类/缩写查看详情<br>
        <span class="kbd">/</span> 搜索 · <span class="kbd">Esc</span> 返回
      </div>
    </div>`;
}

function freqTag(f) {
  if (f >= 5) return '<span class="freq-tag freq-5">★★★★★ 必背</span>';
  if (f >= 4) return '<span class="freq-tag freq-4">★★★★ 高频</span>';
  if (f >= 3) return '<span class="freq-tag freq-3">★★★ 常考</span>';
  return '<span class="freq-tag freq-2">★★ 了解</span>';
}

function showDetail(it) {
  const cat = CATS.find(c => c.id === it.catId);
  const sameCat = cat ? cat.items.filter(i => i.n !== it.name).slice(0, 10) : [];
  const relatedChips = sameCat.map(i => `<span class="related-chip" data-name="${i.n}">${i.n}</span>`).join('');

  // 记忆口诀：有就显示,没有就提示走通用口诀

  const mnemonicBlock = mn ? `
    <div class="mnemonic-card">

  // 知识点展开
  const kn = expandKnowledge(it.name, it.catName);
  const knowledgeBlock = kn.map((k, i) => `

    </details>`).join('');

  document.getElementById('aside').innerHTML = `
    <div class="tag-row">
      ${freqTag(it.freq)}
      <span class="cat-tag" style="color:${it.catColor}">● ${it.catName}</span>

      </div>
    </div>
    <div class="section-label">本类相关</div>
    <div class="related-list">${relatedChips || '<span style="color:var(--ivory-3);font-size:0.8rem">无</span>'}</div>
    <div class="section-label">📌 记忆口诀</div>
    ${mnemonicBlock}
    <div class="section-label">🔍 知识点展开</div>
    ${knowledgeBlock}
    <div class="section-label">操作</div>
    <button id="drill-btn" style="
      width: 100%; padding: 10px;
      background: var(--ink-2); border: 1px solid var(--gold-3);
      color: var(--gold-2); border-radius: 4px;
      font-family: var(--font-display); font-size: 0.8rem;
      letter-spacing: 0.18em; cursor: pointer;
      transition: all 0.15s;">
      ▼ 下钻到「${it.catName}」
    </button>
  `;

  document.querySelectorAll('.related-chip').forEach(ch => {
    ch.addEventListener('click', () => {
      const name = ch.dataset.name;
      const it2 = cat.items.find(i => i.n === name);
      if (it2) selectItem({ name: it2.n, zh: it2.z, freq: it2.f, catId: it.catId }, 2);
    });
  });

  document.getElementById('drill-btn').addEventListener('click', () => {
    currentRoot = it.catId;
    render();
  });
}

// ============== 搜索 ==============
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

function doSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { searchResults.classList.remove('show'); return; }
  const matches = [];
  CATS.forEach(cat => {
    cat.items.forEach(it => {
      if (it.n.toLowerCase().includes(q) || it.z.toLowerCase().includes(q)) {
        matches.push({ n: it.n, z: it.z, catId: cat.id, catName: CAT_NAMES[cat.id], color: cat.color, freq: it.f });
      }
    });
  });
  if (matches.length === 0) {
    searchResults.innerHTML = '<div class="search-result" style="color:var(--ivory-3)">未找到匹配</div>';
    searchResults.classList.add('show');
    return;
  }
  matches.sort((a, b) => b.freq - a.freq);
  searchResults.innerHTML = matches.slice(0, 30).map(m => `
    <div class="search-result" data-name="${m.n}" data-cat="${m.catId}">
      <span class="abbr">${m.n}</span><span class="cat" style="color:${m.color}">● ${m.catName}</span>
      <div class="zh">${m.z}</div>
    </div>
  `).join('') + (matches.length > 30 ? `<div class="search-result" style="text-align:center;color:var(--ivory-3);font-size:0.74rem">还有 ${matches.length - 30} 项未显示…</div>` : '');
  searchResults.classList.add('show');

  searchResults.querySelectorAll('.search-result[data-name]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const catId = el.dataset.cat;
      const name = el.dataset.name;
      const it = CATS.find(c => c.id === catId).items.find(i => i.n === name);
      currentRoot = catId;
      selectedItem = { name: it.n, zh: it.z, freq: it.f, catId };
      render();
      selectItem(selectedItem, 2);
      searchResults.classList.remove('show');
      searchInput.value = '';
    });
  });
}

searchInput.addEventListener('input', e => doSearch(e.target.value));
searchInput.addEventListener('focus', () => { if (searchInput.value) doSearch(searchInput.value); });

document.addEventListener('click', e => {
  if (!e.target.closest('.search-box')) searchResults.classList.remove('show');
});

// ============== 键盘快捷键 ==============
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  } else if (e.key === 'Escape') {
    if (selectedItem) {
      selectedItem = null;
      showEmpty();
    } else if (currentRoot) {
      currentRoot = null;
      render();
    } else if (document.activeElement === searchInput) {
      searchInput.blur();
      searchResults.classList.remove('show');
    }
  }
});

// ============== Legend ==============
function buildLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = CATS.map(c => `
    <div class="legend-item" data-cat="${c.id}">
      <span class="legend-dot" style="background:${c.color}"></span>
      <span>${CAT_NAMES[c.id]}</span>
      <span class="legend-count">${c.items.length}</span>
    </div>
  `).join('');
  legend.querySelectorAll('.legend-item').forEach(el => {
    el.addEventListener('click', () => {
      const catId = el.dataset.cat;
      if (currentRoot === catId) {
        currentRoot = null;
        selectedItem = null;
      } else {
        currentRoot = catId;
        selectedItem = null;
      }
      render();
    });
  });
}

function updateLegendActive() {
  document.querySelectorAll('.legend-item').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === currentRoot);
  });
}

buildLegend();
render();

// ============== Resize ==============
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => myChart.resize(), 80);
});

  <button class="theme-toggle" id="theme-toggle" title="切换深/浅主题 (T)" onclick="toggleTheme()">☾</button>
  <script>
  (function() {
    const KEY = 'calc-theme';
    function apply(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('theme-toggle');
      if (btn) btn.textContent = theme === 'light' ? '☀' : '☾';
    }
    window.toggleTheme = function() {
      const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = cur === 'light' ? 'dark' : 'light';
      try { localStorage.setItem(KEY, next); } catch(e) {}
      apply(next);
      // re-render ECharts with appropriate contrast (chart keeps internal palette but UI flips)
      if (typeof render === 'function') {
        try { render(); } catch(e) {}
      }
    };
    try {
      const saved = localStorage.getItem(KEY);
      if (saved) apply(saved);
    } catch(e) {}
    document.addEventListener('keydown', function(e) {
      if ((e.key === 't' || e.key === 'T') && !e.ctrlKey && !e.metaKey && !e.altKey
          && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) {
        toggleTheme();
      }
    });
  })();
  </script>
